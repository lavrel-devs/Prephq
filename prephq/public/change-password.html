
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<script src="/js/theme.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e0e5ec">
<link rel="manifest" href="/manifest.json">
<title>PrepHQ — New Password</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="/css/glass.css">
<style>
/* ══════════════════════════════════════════════════════════
   NEUMORPHISM / SOFT UI — Login
   ══════════════════════════════════════════════════════════ */
:root{
  --bg:#e0e5ec;
  --sd:#b8c0cc;
  --sl:#ffffff;

  --sh:6px 6px 14px var(--sd), -6px -6px 14px var(--sl);
  --sh-md:8px 8px 18px var(--sd), -8px -8px 18px var(--sl);
  --sh-lg:12px 12px 26px var(--sd), -12px -12px 26px var(--sl);
  --sh-sm:4px 4px 8px var(--sd), -4px -4px 8px var(--sl);
  --sh-in:inset 4px 4px 10px var(--sd), inset -4px -4px 10px var(--sl);
  --sh-in-sm:inset 3px 3px 6px var(--sd), inset -3px -3px 6px var(--sl);
  --sh-in-lg:inset 6px 6px 14px var(--sd), inset -6px -6px 14px var(--sl);

  --brand:#4a67d1;--brand-dk:#3a54b8;
  --brand-lt:rgba(74,103,209,.10);--brand-glow:rgba(74,103,209,.20);
  --ok:#2d9c6e;--ok-lt:rgba(45,156,110,.12);
  --no:#d14545;--no-lt:rgba(209,69,69,.12);--no-bd:rgba(209,69,69,.30);
  --warn:#c67a1e;
  --purple:#7b52d1;--purple-lt:rgba(123,82,209,.12);
  --teal:#2d9cb8;

  --t1:#2a3142;--t2:#4a5568;--t3:#7a8296;--t4:#a8b0c0;

  --bd:transparent;--bd2:transparent;

  --r8:10px;--r12:14px;--r16:18px;--r20:22px;--r24:26px;--rpill:999px;
  --ff-h:'Bricolage Grotesque',system-ui,sans-serif;
  --ff-b:'DM Sans',system-ui,sans-serif;
  --ease-o:cubic-bezier(.22,1,.36,1);
}
[data-theme=dark]{
  --bg:#252932;
  --sd:#181b21;--sl:#323743;
  --brand:#7c93ff;--brand-dk:#a5b5ff;
  --brand-lt:rgba(124,147,255,.12);--brand-glow:rgba(124,147,255,.20);
  --ok:#3dba86;--ok-lt:rgba(61,186,134,.14);
  --no:#e56161;--no-lt:rgba(229,97,97,.14);--no-bd:rgba(229,97,97,.30);
  --warn:#e09437;
  --purple:#9d7bea;--purple-lt:rgba(157,123,234,.14);
  --teal:#4db8d4;
  --t1:#e8ecf5;--t2:#b8c0d0;--t3:#7a8296;--t4:#4a5060;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{height:100%;}
body{
  font-family:var(--ff-b);
  background:var(--bg);
  color:var(--t1);
  min-height:100dvh;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
  position:relative;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* Soft colored haze — no longer blobs, just gradient washes that
   respect the neumorphic "one surface" rule by staying very low
   opacity so the shadows do the visual work. */
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.10;pointer-events:none;}
.b1{width:380px;height:380px;background:var(--brand);top:-100px;right:-100px;}
.b2{width:320px;height:320px;background:var(--purple);bottom:-80px;left:-80px;}
.b3{width:260px;height:260px;background:var(--teal);bottom:20%;right:-60px;}

.card{
  width:100%;max-width:410px;
  position:relative;z-index:1;
  padding:38px 28px 30px;
  background:var(--bg);
  border-radius:28px;
  box-shadow:var(--sh-lg);
  border:none;
}
.logo{
  width:68px;height:68px;border-radius:22px;
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 20px;
  box-shadow:var(--sh);
}
.logo i{font-size:26px;color:var(--brand);}
.title{font-family:var(--ff-h);font-size:24px;font-weight:800;text-align:center;letter-spacing:-.5px;}
.sub{font-size:13px;color:var(--t3);text-align:center;margin-top:5px;margin-bottom:22px;}

/* Segmented tab control — inset trough with a raised active pill */
.tabs{
  display:flex;
  background:var(--bg);
  border:none;
  border-radius:var(--rpill);
  padding:5px;
  margin-bottom:22px;
  box-shadow:var(--sh-in-sm);
}
.tab{
  flex:1;text-align:center;
  padding:10px 0;
  border-radius:var(--rpill);
  font-size:13px;font-weight:800;
  color:var(--t3);
  cursor:pointer;
  transition:box-shadow .18s, color .18s, background .18s;
  background:transparent;
}
.tab:active{transform:scale(.98);}
.tab.on{
  background:var(--bg);
  color:var(--brand);
  box-shadow:var(--sh-sm);
}

/* Error banner */
.err-banner{
  background:var(--bg);
  box-shadow:var(--sh-in), 0 0 0 2px var(--no-lt);
  border-radius:var(--r8);
  padding:11px 14px;
  font-size:13px;font-weight:600;
  color:var(--no);
  display:none;align-items:center;gap:7px;
  margin-bottom:14px;
}
.err-banner.on{display:flex;}

/* Inputs — inset wells */
.f-group{margin-bottom:16px;}
.f-label{
  font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:.08em;
  color:var(--t3);
  display:flex;align-items:center;gap:6px;
  margin-bottom:8px;
}
.f-label .fa-ico{font-size:11px;}
.f-input-wrap{position:relative;}
.f-input-icon{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  color:var(--t4);pointer-events:none;font-size:15px;
  transition:color .18s;
}
.f-input{
  width:100%;
  padding:14px 14px 14px 42px;
  border-radius:var(--r12);
  border:none;
  background:var(--bg);
  font-size:15px;font-weight:600;
  color:var(--t1);
  outline:none;
  transition:box-shadow .18s;
  box-shadow:var(--sh-in);
  letter-spacing:.3px;
}
.f-input::placeholder{color:var(--t4);font-weight:500;letter-spacing:0;}
.f-input:focus{box-shadow:var(--sh-in), 0 0 0 2px var(--brand-lt);}
.f-input:focus + .f-input-icon,
.f-input-wrap:focus-within .f-input-icon{color:var(--brand);}
.f-input.err{box-shadow:var(--sh-in), 0 0 0 2px var(--no-lt);}
.f-hint{font-size:11px;color:var(--t4);margin-top:6px;padding-left:2px;}

/* Primary button — raised neutral with brand text, inverts on press */
.btn-grad{
  width:100%;
  padding:16px;
  border-radius:var(--r12);
  background:var(--bg);
  color:var(--brand);
  font-size:16px;font-weight:800;
  border:none;cursor:pointer;
  box-shadow:var(--sh);
  transition:box-shadow .15s, transform .15s, color .15s;
  font-family:var(--ff-h);
  display:flex;align-items:center;justify-content:center;gap:8px;
  letter-spacing:-.2px;
}
.btn-grad:active{transform:scale(.98);box-shadow:var(--sh-in);}
.btn-grad:disabled{
  color:var(--t4);
  box-shadow:var(--sh-in);
  cursor:default;transform:none;
}
.btn-grad i{font-size:14px;}

.foot{text-align:center;margin-top:18px;font-size:13px;color:var(--t3);}
.foot a{color:var(--brand);font-weight:700;text-decoration:none;}
.foot a:active{opacity:.7;}

/* Toast — raised neutral pill with brand text */
#toast{
  position:fixed;bottom:24px;left:50%;
  transform:translateX(-50%) translateY(16px);
  background:var(--bg);
  color:var(--brand);
  padding:12px 22px;
  border-radius:var(--rpill);
  font-size:13px;font-weight:700;
  opacity:0;
  transition:all .3s var(--ease-o);
  z-index:999;pointer-events:none;white-space:nowrap;
  box-shadow:var(--sh-md);
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

/* Responsive */
@media (max-width: 420px){
  .card{padding:32px 22px 26px;}
  .title{font-size:22px;}
}
</style>
</head>
<body class="fs-md">
<div class="glass-backdrop"></div>
<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="blob b3"></div>

<div id="toast"></div>

<div class="card">
  <div class="logo"><i class="fa-solid fa-key"></i></div>
  <div class="title">Choose a new password</div>
  <div class="sub" id="c-sub">Pick a password only you know. You'll use it from now on.</div>

  <div class="err-banner" id="err"><i class="fa-solid fa-circle-exclamation"></i><span id="err-msg">Something went wrong</span></div>

  <form onsubmit="return false;">
    <div class="f-group">
      <div class="f-label"><i class="fa-solid fa-lock fa-ico"></i> Current / temporary password</div>
      <div class="f-input-wrap"><i class="fa-solid fa-key f-input-icon"></i>
        <input class="f-input" id="c-old" type="password" autocomplete="current-password" placeholder="The password you just used"></div>
    </div>
    <div class="f-group">
      <div class="f-label"><i class="fa-solid fa-lock fa-ico"></i> New password</div>
      <div class="f-input-wrap"><i class="fa-solid fa-key f-input-icon"></i>
        <input class="f-input" id="c-new" type="password" autocomplete="new-password" placeholder="At least 8 characters"></div>
    </div>
    <div class="f-group">
      <div class="f-label"><i class="fa-solid fa-lock fa-ico"></i> Confirm new password</div>
      <div class="f-input-wrap"><i class="fa-solid fa-key f-input-icon"></i>
        <input class="f-input" id="c-new2" type="password" autocomplete="new-password" placeholder="Type it again"></div>
      <div class="f-hint"><label style="cursor:pointer;"><input type="checkbox" onchange="togglePw(this.checked)"> Show passwords</label></div>
    </div>
    <button class="btn-grad" id="c-btn" onclick="changePw()"><i class="fa-solid fa-check"></i> Save new password</button>
    <div class="foot"><a href="#" onclick="PhqAuth.logout?PhqAuth.logout('student'):(location.href='/login');return false;">Sign out</a></div>
  </form>
</div>
<script src="/js/auth-guard.js"></script>
<script>
function showErr(m){ document.getElementById('err-msg').textContent=m; document.getElementById('err').classList.add('on'); }
function clearErr(){ document.getElementById('err').classList.remove('on'); }
function togglePw(on){ ['c-old','c-new','c-new2'].forEach(id=>document.getElementById(id).type=on?'text':'password'); }
if(!PhqAuth.getSession || !PhqAuth.getSession()) location.href='/login';
async function changePw(){
  clearErr();
  const cur=document.getElementById('c-old').value, nw=document.getElementById('c-new').value, nw2=document.getElementById('c-new2').value;
  if(!cur||!nw){ showErr('Fill in all the fields.'); return; }
  if(nw.length<8){ showErr('Your new password must be at least 8 characters.'); return; }
  if(nw!==nw2){ showErr('The two new passwords do not match.'); return; }
  const btn=document.getElementById('c-btn'); btn.disabled=true;
  try{
    const r=await PhqAuth.authFetch('/api/auth/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({currentPassword:cur,newPassword:nw})},'student');
    const d=await r.json();
    if(!r.ok){ showErr(d.error||'Could not change your password.'); btn.disabled=false; return; }
    location.href='/dashboard';
  }catch(e){ showErr('Cannot connect to server.'); btn.disabled=false; }
}
</script>
</body>
</html>
