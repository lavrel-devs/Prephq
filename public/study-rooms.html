<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0A5CF5">
<link rel="manifest" href="/manifest.json">
<title>PrepHQ — Study Rooms</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="/css/glass.css">
<script src="/js/auth-guard.js"></script>
<script src="/js/shared-nav.js"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
(function(){
  const s = PhqAuth.getSession();
  if(!s || !s.accessToken || s.role !== 'student'){ window.location.replace('/login.html'); }
})();
</script>
<style>
:root{
  --bg:#F0F2F8;--surf:rgba(255,255,255,.6);--surf2:rgba(245,246,250,.55);--surf3:rgba(235,236,242,.55);
  --brand:#0A5CF5;--brand-dk:#0847C4;--brand-lt:rgba(10,92,245,.10);
  --ok:#00C96B;--ok-lt:rgba(0,201,107,.10);
  --no:#F5340A;--no-lt:rgba(245,52,10,.10);
  --warn:#F5930A;--warn-lt:rgba(245,147,10,.10);
  --purple:#7B2CF5;--purple-lt:rgba(123,44,245,.10);
  --t1:#0D0F1A;--t2:#2E3247;--t3:#6B7089;--t4:#A8ADCA;
  --bd:rgba(13,15,26,.09);--bd2:rgba(13,15,26,.14);
  --r16:16px;--r20:20px;
  --sh:0 2px 16px rgba(0,0,0,.07);
  --ff-h:'Bricolage Grotesque',system-ui,sans-serif;
  --ff-b:'DM Sans',system-ui,sans-serif;
}
[data-theme=dark]{
  --bg:#0D0F1A;--surf:rgba(26,30,53,.55);--surf2:rgba(34,38,64,.5);--surf3:rgba(42,47,80,.5);
  --t1:#EEF0FF;--t2:#C5CAE8;--t3:#7E86B0;--t4:#4A5070;
  --bd:rgba(238,240,255,.08);--bd2:rgba(238,240,255,.14);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:var(--ff-b);background:var(--bg);color:var(--t1);min-height:100dvh;-webkit-font-smoothing:antialiased;}
.wrap{max-width:520px;margin:0 auto;padding:18px 18px 120px;}
.topbar{display:flex;align-items:center;gap:12px;padding:6px 0 16px;}
.back-btn{width:38px;height:38px;border-radius:50%;background:var(--surf);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t1);flex-shrink:0;}
.pg-title{font-family:var(--ff-h);font-size:20px;font-weight:800;}
.card{background:var(--surf);border-radius:var(--r20);padding:18px;box-shadow:var(--sh);border:1px solid var(--bd);margin-bottom:14px;}
.f-input{width:100%;padding:11px 13px;border-radius:11px;border:1.5px solid var(--bd2);background:var(--surf2);font-size:14px;font-weight:600;color:var(--t1);outline:none;margin-bottom:10px;}
.btn{border:none;border-radius:12px;padding:12px;font-weight:700;font-size:14px;cursor:pointer;width:100%;background:linear-gradient(135deg,var(--brand),var(--purple));color:#fff;}
.btn.ghost{background:var(--surf3);color:var(--t1);}
.sec-title{font-size:13px;font-weight:800;color:var(--t3);text-transform:uppercase;letter-spacing:.03em;margin-bottom:10px;}
.lobby-code{font-family:monospace;font-size:32px;font-weight:800;letter-spacing:4px;text-align:center;color:var(--brand);margin:14px 0;}
.p-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd);font-size:13.5px;font-weight:600;}
.p-row:last-child{border-bottom:none;}
.q-timer{font-family:var(--ff-h);font-weight:800;font-size:28px;text-align:center;color:var(--brand);margin-bottom:10px;}
.q-text{font-size:16px;font-weight:700;text-align:center;margin-bottom:18px;}
.opt-btn{display:block;width:100%;text-align:left;padding:13px 16px;border-radius:12px;margin-bottom:8px;border:1.5px solid var(--bd2);background:var(--surf2);font-size:14px;font-weight:600;cursor:pointer;}
.opt-btn.picked{border-color:var(--brand);background:var(--brand-lt);}
.opt-btn.correct{border-color:var(--ok);background:var(--ok-lt);}
.opt-btn.wrong{border-color:var(--no);background:var(--no-lt);}
.opt-btn:disabled{cursor:default;}
.hidden{display:none;}
</style>
</head>
<body>
<div class="glass-backdrop"></div>
<div class="wrap">
  <div class="topbar">
    <div class="back-btn" onclick="leaveAndGoBack()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg></div>
    <div class="pg-title">Study Rooms</div>
  </div>

  <!-- ═══ SCREEN: BROWSE/CREATE/JOIN ═══ -->
  <div id="screen-lobby">
    <div class="card">
      <div class="sec-title">Create a Room</div>
      <select class="f-input" id="create-course"><option value="">— select course —</option></select>
      <div style="display:flex;gap:8px;">
        <input type="number" class="f-input" id="create-count" placeholder="Questions" value="10" style="flex:1;">
        <input type="number" class="f-input" id="create-seconds" placeholder="Sec/question" value="20" style="flex:1;">
      </div>
      <button class="btn" onclick="createRoom()">Create Room</button>
    </div>
    <div class="card">
      <div class="sec-title">Join a Room</div>
      <input class="f-input" id="join-code-input" placeholder="Room code" autocapitalize="none" style="text-transform:uppercase;">
      <button class="btn ghost" onclick="joinRoomByCode()">Join</button>
    </div>
  </div>

  <!-- ═══ SCREEN: WAITING ROOM ═══ -->
  <div id="screen-waiting" class="hidden">
    <div class="card">
      <div class="sec-title" style="text-align:center;">Room Code — share with friends</div>
      <div class="lobby-code" id="waiting-code">—</div>
      <div id="waiting-course" style="text-align:center;font-size:12.5px;color:var(--t3);margin-bottom:14px;"></div>
      <div id="waiting-participants"></div>
      <button class="btn" id="start-room-btn" style="margin-top:14px;display:none;" onclick="startRoom()">Start Room</button>
      <div id="waiting-hint" style="text-align:center;font-size:12px;color:var(--t3);margin-top:10px;">Waiting for the host to start…</div>
    </div>
  </div>

  <!-- ═══ SCREEN: LIVE QUESTION ═══ -->
  <div id="screen-question" class="hidden">
    <div class="card">
      <div style="font-size:11.5px;color:var(--t3);text-align:center;margin-bottom:4px;" id="q-progress">Question 1 of 10</div>
      <div class="q-timer" id="q-timer">20</div>
      <div class="q-text" id="q-text"></div>
      <div id="q-options"></div>
    </div>
    <div class="card">
      <div class="sec-title">Live Scores</div>
      <div id="live-scores"></div>
    </div>
  </div>

  <!-- ═══ SCREEN: RESULTS (final) ═══ -->
  <div id="screen-ended" class="hidden">
    <div class="card">
      <div class="sec-title" style="text-align:center;">Final Results</div>
      <div id="final-scores"></div>
      <button class="btn" style="margin-top:14px;" onclick="window.location.href='/study-rooms'">Back to Lobby</button>
    </div>
  </div>
</div>

<script>
let socket = null;
let currentRoomCode = null;
let myMatric = null;
let hasAnsweredCurrent = false;

function showScreen(id){
  ['screen-lobby','screen-waiting','screen-question','screen-ended'].forEach(s => {
    document.getElementById(s).classList.toggle('hidden', s !== id);
  });
}

async function loadCourses(){
  try{
    const r = await fetch('/api/courses');
    if(!r.ok) return;
    const courses = await r.json();
    document.getElementById('create-course').innerHTML = '<option value="">— select course —</option>' + courses.map(c => `<option value="${c.key}">${c.courseCode}</option>`).join('');
  }catch(e){}
}

function connectSocket(){
  if(socket) return socket;
  socket = io({ auth: { token: PhqAuth.getSession().accessToken } });

  socket.on('room-state', (state) => {
    if(state.status === 'waiting') renderWaiting(state);
  });
  socket.on('room-error', (d) => { alert(d.error || 'Something went wrong'); });
  socket.on('question', (d) => renderQuestion(d));
  socket.on('question-result', (d) => renderQuestionResult(d));
  socket.on('room-ended', (d) => renderEnded(d));

  return socket;
}

async function createRoom(){
  const course = document.getElementById('create-course').value;
  if(!course){ alert('Select a course'); return; }
  const questionCount = parseInt(document.getElementById('create-count').value, 10) || 10;
  const secondsPerQuestion = parseInt(document.getElementById('create-seconds').value, 10) || 20;
  try{
    const r = await PhqAuth.authFetch('/api/study-rooms', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ course, questionCount, secondsPerQuestion }),
    }, 'student');
    const d = await r.json();
    if(!r.ok){ alert(d.error || 'Could not create room'); return; }
    enterRoom(d.code);
  }catch(e){ alert('Could not create room'); }
}

function joinRoomByCode(){
  const code = document.getElementById('join-code-input').value.trim().toUpperCase();
  if(!code){ alert('Enter a room code'); return; }
  enterRoom(code);
}

function enterRoom(code){
  currentRoomCode = code;
  connectSocket();
  socket.emit('join-room', { code });
  showScreen('screen-waiting');
  document.getElementById('waiting-code').textContent = code;
}

function renderWaiting(state){
  document.getElementById('waiting-course').textContent = state.course;
  document.getElementById('waiting-participants').innerHTML = state.participants.map(p =>
    `<div class="p-row"><span>${escapeHtml(p.username || p.matric)}</span><span>${p.score}</span></div>`
  ).join('');
  // getSession doesn't carry matric directly — infer host-ness from the room state's hostMatric vs our own /api/me cache.
  fetchMyMatricOnce().then(matric => {
    document.getElementById('start-room-btn').style.display = (state.hostMatric === matric) ? 'block' : 'none';
  });
}

let cachedMatric = null;
async function fetchMyMatricOnce(){
  if(cachedMatric) return cachedMatric;
  try{
    const r = await PhqAuth.authFetch('/api/me', {}, 'student');
    const d = await r.json();
    cachedMatric = d.matric;
    myMatric = d.matric;
    return cachedMatric;
  }catch(e){ return null; }
}

function startRoom(){
  socket.emit('start-room');
}

let qTimerInterval = null;
function renderQuestion(d){
  showScreen('screen-question');
  hasAnsweredCurrent = false;
  document.getElementById('q-progress').textContent = `Question ${d.index + 1} of ${d.total}`;
  document.getElementById('q-text').textContent = d.question.q;
  document.getElementById('q-options').innerHTML = d.question.opts.map((opt, i) =>
    `<button class="opt-btn" id="opt-${i}" onclick="pickAnswer(${i})">${escapeHtml(opt)}</button>`
  ).join('');

  let remaining = d.secondsPerQuestion;
  document.getElementById('q-timer').textContent = remaining;
  clearInterval(qTimerInterval);
  qTimerInterval = setInterval(() => {
    remaining--;
    document.getElementById('q-timer').textContent = Math.max(0, remaining);
    if(remaining <= 0) clearInterval(qTimerInterval);
  }, 1000);
}

function pickAnswer(i){
  if(hasAnsweredCurrent) return;
  hasAnsweredCurrent = true;
  document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
  document.getElementById(`opt-${i}`).classList.add('picked');
  socket.emit('submit-answer', { answerIndex: i });
}

function renderQuestionResult(d){
  clearInterval(qTimerInterval);
  document.querySelectorAll('.opt-btn').forEach((b, i) => {
    b.disabled = true;
    if(i === d.correctIndex) b.classList.add('correct');
    else if(b.classList.contains('picked')) b.classList.add('wrong');
  });
  document.getElementById('live-scores').innerHTML = [...d.participants].sort((a,b)=>b.score-a.score).map(p =>
    `<div class="p-row"><span>${escapeHtml(p.username || p.matric)}</span><span>${p.score}</span></div>`
  ).join('');
}

function renderEnded(d){
  showScreen('screen-ended');
  document.getElementById('final-scores').innerHTML = d.participants.map(p =>
    `<div class="p-row"><span>#${p.rank} ${escapeHtml(p.username || p.matric)}</span><span>${p.score}</span></div>`
  ).join('');
}

function leaveAndGoBack(){
  if(socket && currentRoomCode) socket.emit('leave-room');
  window.location.href = '/dashboard';
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

loadCourses();
fetchMyMatricOnce();

// If arriving via a shared link like /study-rooms?join=ABCDE, jump straight to joining.
(function autoJoinFromLink(){
  const code = new URLSearchParams(window.location.search).get('join');
  if(code) enterRoom(code.toUpperCase());
})();
</script>
</body>
</html>
