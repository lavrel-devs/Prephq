<!-- View: Wreddi Secondary — JAMB, WAEC, NECO and school-exam prep. Loaded once by js/shell.js into <div class="scr" id="view-secondary">,
     then only shown and hidden. Panes: setup, hub, pick (practice options), run (the paper), result.
     Papers come from GET /api/secondary/paper; finished papers are saved with POST /api/scores/:matric (mode sec-mock / sec-practice). -->
<style>
#view-secondary *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
#view-secondary{font-family:var(--ff-b);color:var(--t1);min-height:calc(100dvh - var(--nav-space,96px));-webkit-font-smoothing:antialiased;}
#view-secondary .v-wrap{max-width:600px;margin:0 auto;padding:18px 18px 120px;}
#view-secondary .v-topbar{display:flex;align-items:center;gap:12px;padding:6px 0 14px;}
#view-secondary .v-back{width:38px;height:38px;border-radius:50%;background:var(--surf);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--brand);flex-shrink:0;box-shadow:var(--sh);}
#view-secondary .v-title{font-family:var(--ff-h);font-weight:700;font-size:20px;letter-spacing:-.4px;flex:1;min-width:0;}
#view-secondary .v-sub{font-size:12.5px;color:var(--t3);font-weight:600;margin-top:2px;}
#view-secondary .v-card{background:var(--surf);border-radius:18px;box-shadow:var(--sh);padding:16px;margin-bottom:14px;}
#view-secondary .v-h{font-family:var(--ff-h);font-weight:700;font-size:14px;margin:18px 2px 10px;color:var(--t2);}
#view-secondary .v-lead{font-size:14px;line-height:1.55;color:var(--t2);margin-bottom:14px;}
#view-secondary .v-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;font-family:var(--ff-h);font-weight:700;font-size:14px;padding:12px 18px;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--purple));color:#fff;}
#view-secondary .v-btn:disabled{opacity:.45;cursor:not-allowed;}
#view-secondary .v-btn-soft{background:var(--bg);color:var(--brand);box-shadow:var(--sh);}
#view-secondary .v-btn-wide{width:100%;}
#view-secondary .v-btn-sm{padding:8px 13px;font-size:12.5px;border-radius:11px;}
#view-secondary .v-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
#view-secondary .v-grow{flex:1;min-width:0;}
#view-secondary .v-pill{padding:4px 10px;border-radius:99px;box-shadow:var(--sh-in-sm);color:var(--brand);font-size:11.5px;font-weight:700;}
#view-secondary .v-err{color:var(--no);font-size:13px;font-weight:600;margin:10px 0 0;line-height:1.45;}
#view-secondary .v-note{font-size:12px;color:var(--t3);line-height:1.5;margin-top:8px;}
#view-secondary .v-empty{text-align:center;color:var(--t3);font-size:13.5px;line-height:1.6;padding:26px 10px;}
#view-secondary .v-link{color:var(--brand);font-weight:700;font-size:13px;cursor:pointer;background:none;border:none;font-family:inherit;}
/* exam choice cards */
#view-secondary .v-exams{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
#view-secondary .v-exam{background:var(--surf);border-radius:16px;box-shadow:var(--sh);padding:14px;cursor:pointer;border:2px solid transparent;text-align:left;font-family:inherit;color:inherit;}
#view-secondary .v-exam b{display:block;font-family:var(--ff-h);font-size:16px;}
#view-secondary .v-exam span{display:block;font-size:12px;color:var(--t3);margin-top:3px;line-height:1.4;}
#view-secondary .v-exam.selected{border-color:var(--brand);}
/* chips */
#view-secondary .v-chips{display:flex;flex-wrap:wrap;gap:8px;}
#view-secondary .v-chip{padding:9px 13px;border-radius:12px;background:var(--bg);box-shadow:var(--sh-in-sm);font-size:13px;font-weight:600;cursor:pointer;border:2px solid transparent;font-family:inherit;color:var(--t1);}
#view-secondary .v-chip.selected{border-color:var(--brand);color:var(--brand);}
#view-secondary .v-chip.v-locked{opacity:.75;cursor:default;}
#view-secondary .v-field{width:100%;padding:12px 14px;border-radius:12px;border:none;background:var(--bg);box-shadow:var(--sh-in-sm);font-family:inherit;font-size:14px;color:var(--t1);}
#view-secondary .v-lbl{display:block;font-size:12px;font-weight:700;color:var(--t3);margin:12px 2px 6px;}
/* hub */
#view-secondary .v-hero{background:linear-gradient(135deg,var(--brand),var(--purple));color:#fff;border-radius:20px;padding:18px;margin-bottom:14px;}
#view-secondary .v-hero .v-big{font-family:var(--ff-h);font-weight:800;font-size:34px;letter-spacing:-1px;line-height:1.05;}
#view-secondary .v-hero .v-small{font-size:12.5px;opacity:.85;font-weight:600;}
#view-secondary .v-bar{height:9px;border-radius:99px;background:var(--fill);box-shadow:var(--sh-in-sm);overflow:hidden;}
#view-secondary .v-bar i{display:block;height:100%;border-radius:99px;background:var(--brand);}
#view-secondary .v-subj{display:flex;gap:12px;align-items:center;}
#view-secondary .v-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
#view-secondary .v-stat{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;}
#view-secondary .v-stat div{font-size:11.5px;color:rgba(255,255,255,.8);font-weight:600;}
#view-secondary .v-stat b{display:block;font-family:var(--ff-h);font-size:19px;color:#fff;}
/* runner */
#view-secondary .v-runbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;display:flex;align-items:center;gap:10px;}
#view-secondary .v-timer{font-family:var(--ff-h);font-weight:800;font-size:17px;padding:7px 12px;border-radius:12px;background:var(--surf);box-shadow:var(--sh);font-variant-numeric:tabular-nums;}
#view-secondary .v-timer.v-low{color:var(--no);}
#view-secondary .v-q{font-size:15.5px;line-height:1.6;font-weight:600;margin-bottom:14px;}
#view-secondary .v-qmeta{font-size:11.5px;color:var(--t3);font-weight:700;margin-bottom:8px;display:flex;gap:8px;flex-wrap:wrap;}
#view-secondary .v-opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:13px 14px;border-radius:14px;background:var(--bg);box-shadow:var(--sh-in-sm);margin-bottom:9px;font-family:inherit;font-size:14.5px;line-height:1.5;color:var(--t1);cursor:pointer;border:2px solid transparent;}
#view-secondary .v-opt .v-let{width:26px;height:26px;border-radius:50%;background:var(--surf);box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex-shrink:0;}
#view-secondary .v-opt.selected{border-color:var(--brand);}
#view-secondary .v-opt.correct{border-color:var(--ok);background:var(--ok-lt);}
#view-secondary .v-opt.wrong{border-color:var(--no);background:var(--no-lt);}
#view-secondary .v-exp{margin-top:6px;font-size:13px;line-height:1.55;padding:11px 13px;border-radius:12px;box-shadow:var(--sh-in-sm);color:var(--t2);}
#view-secondary .v-pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:7px;}
#view-secondary .v-pn{height:38px;border-radius:10px;border:2px solid transparent;background:var(--bg);box-shadow:var(--sh-in-sm);font-weight:700;font-size:12.5px;cursor:pointer;color:var(--t2);font-family:inherit;}
#view-secondary .v-pn.v-done{background:var(--brand);color:#fff;}
#view-secondary .v-pn.v-here{border-color:var(--warn);}
#view-secondary .v-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;}
#view-secondary .v-tab{flex-shrink:0;padding:8px 12px;border-radius:11px;background:var(--surf);box-shadow:var(--sh);font-size:12px;font-weight:700;cursor:pointer;border:2px solid transparent;font-family:inherit;color:var(--t2);}
#view-secondary .v-tab.selected{border-color:var(--brand);color:var(--brand);}
/* results */
#view-secondary .v-grade{font-family:var(--ff-h);font-weight:800;font-size:15px;min-width:38px;text-align:center;padding:5px 8px;border-radius:10px;}
#view-secondary .v-g-ok{background:var(--ok-lt);color:var(--ok);}
#view-secondary .v-g-mid{background:var(--warn-lt);color:var(--warn);}
#view-secondary .v-g-no{background:var(--no-lt);color:var(--no);}
#view-secondary .v-pane[hidden]{display:none;}
@keyframes vsecondary-fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
#view-secondary .v-pane{animation:vsecondary-fade .22s ease both;}
</style>

<div class="v-wrap">

  <!-- ═══ SETUP ═══ -->
  <div class="v-pane" id="sx-p-setup" hidden>
    <div class="v-topbar">
      <div class="v-back" onclick="sxBackFromSetup()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg></div>
      <div class="v-grow"><div class="v-title" id="sx-su-title">Set up Wreddi Secondary</div><div class="v-sub" id="sx-su-step"></div></div>
    </div>
    <div id="sx-su-body"></div>
    <div class="v-err" id="sx-su-err"></div>
    <div class="v-row" style="margin-top:16px;">
      <button class="v-btn v-btn-soft" id="sx-su-back" onclick="sxSetupBack()" style="display:none;">Back</button>
      <button class="v-btn v-grow" id="sx-su-next" onclick="sxSetupNext()">Continue</button>
    </div>
  </div>

  <!-- ═══ HUB ═══ -->
  <div class="v-pane" id="sx-p-hub" hidden>
    <div class="v-topbar">
      <div class="v-back" onclick="PhqShell.go('/dashboard')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg></div>
      <div class="v-grow"><div class="v-title">Secondary</div><div class="v-sub" id="sx-hub-sub">JAMB · WAEC · NECO · School</div></div>
      <button class="v-btn v-btn-soft v-btn-sm" onclick="sxEditSetup()">Edit setup</button>
    </div>
    <div id="sx-hub-body"><div class="v-empty">Loading…</div></div>
  </div>

  <!-- ═══ PRACTICE OPTIONS ═══ -->
  <div class="v-pane" id="sx-p-pick" hidden>
    <div class="v-topbar">
      <div class="v-back" onclick="sxShow('hub')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg></div>
      <div class="v-grow"><div class="v-title" id="sx-pick-title">Practice</div><div class="v-sub" id="sx-pick-sub"></div></div>
    </div>
    <div class="v-card" id="sx-pick-body"></div>
    <div class="v-err" id="sx-pick-err"></div>
  </div>

  <!-- ═══ THE PAPER ═══ -->
  <div class="v-pane" id="sx-p-run" hidden>
    <div class="v-runbar">
      <div class="v-grow"><div class="v-title" id="sx-run-title" style="font-size:15px;">Paper</div><div class="v-sub" id="sx-run-count"></div></div>
      <div class="v-timer" id="sx-timer" style="display:none;">00:00</div>
      <button class="v-btn v-btn-sm" onclick="sxAskSubmit()">Submit</button>
    </div>
    <div class="v-tabs" id="sx-tabs"></div>
    <div class="v-card" id="sx-q"></div>
    <div class="v-row" style="margin-bottom:14px;">
      <button class="v-btn v-btn-soft v-grow" onclick="sxStep(-1)">Previous</button>
      <button class="v-btn v-btn-soft v-grow" onclick="sxStep(1)">Next</button>
    </div>
    <div class="v-card"><div class="v-h" style="margin:0 2px 10px;">Question map</div><div class="v-pal" id="sx-pal"></div></div>
    <div class="v-card" id="sx-confirm" style="display:none;">
      <div id="sx-confirm-txt" style="font-size:14px;line-height:1.55;font-weight:600;margin-bottom:12px;"></div>
      <div class="v-row"><button class="v-btn v-btn-soft v-grow" onclick="sxCancelSubmit()">Keep going</button><button class="v-btn v-grow" onclick="sxFinish(false)">Submit now</button></div>
    </div>
  </div>

  <!-- ═══ RESULT ═══ -->
  <div class="v-pane" id="sx-p-result" hidden>
    <div class="v-topbar">
      <div class="v-back" onclick="sxHome()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg></div>
      <div class="v-grow"><div class="v-title">Your result</div><div class="v-sub" id="sx-res-sub"></div></div>
    </div>
    <div id="sx-res-body"></div>
  </div>

</div>

<script>
const document = PhqShell.scope(root); // every getElementById/querySelector in this view only sees this view

const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);
const api = (url, opts) => PhqAuth.authFetch(url, opts || {}, 'student');
const jsonOpts = (method, body) => ({ method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
const say = m => { try { window.toast && window.toast(m); } catch (e) {} };
const KEY_ENG = 'seceng', KEY_MTH = 'secmth';

const X = {
  cfg: null, prof: null, matric: '', ov: null,
  su: { step: 0, exam: '', classLevel: '', subjects: [], examDate: '', targetScore: '', courseOfStudy: '', school: '' },
  pickCtx: null,
  paper: null, flat: [], ans: {}, idx: 0, left: 0, tick: null, practice: false, startedAt: 0, finished: false, pendingSave: null,
};

// ── panes ────────────────────────────────────────────────────
function sxShow(name) {
  ['setup', 'hub', 'pick', 'run', 'result'].forEach(n => { const el = $('sx-p-' + n); if (el) el.hidden = n !== name; });
  window.scrollTo(0, 0);
  if (name === 'hub') sxLoadHub();
}
window.sxShow = sxShow;
function sxHome() { sxShow('hub'); }
window.sxHome = sxHome;

// ── boot ─────────────────────────────────────────────────────
async function boot() {
  try {
    const [c, p] = await Promise.all([api('/api/secondary/config'), api('/api/secondary/profile')]);
    if (!c.ok || !p.ok) throw new Error('bad');
    X.cfg = await c.json(); const pd = await p.json();
    X.prof = pd; X.matric = pd.matric;
    if (!pd.setUp) { sxStartSetup(false); } else { sxShow('hub'); }
  } catch (e) {
    sxShow('hub'); $('sx-hub-body').innerHTML = '<div class="v-empty">Could not open Secondary. Check your connection and try again.<br><br><button class="v-btn v-btn-sm" onclick="sxRetryBoot()">Try again</button></div>';
  }
}
function sxRetryBoot() { $('sx-hub-body').innerHTML = '<div class="v-empty">Loading…</div>'; boot(); }
window.sxRetryBoot = sxRetryBoot;

// ═══ SETUP ═══════════════════════════════════════════════════
const EXAM_BLURB = {
  jamb: 'UTME: four subjects, English plus three. Timed CBT mock, scored out of 400.',
  waec: 'WASSCE: up to nine subjects. Practise by subject and see your A1–F9 grade.',
  neco: 'SSCE: up to nine subjects. Same grading, same credit rules.',
  school: 'Your class exams (JSS1–SS3): practise topic by topic.',
};
function sxStartSetup(editing) {
  const p = (X.prof && X.prof.secondary) || {};
  X.su = { step: 0, exam: p.exam || '', classLevel: p.classLevel || '', subjects: (p.subjects || []).slice(), examDate: p.examDate ? String(p.examDate).slice(0, 10) : '', targetScore: p.targetScore == null ? '' : p.targetScore, courseOfStudy: p.courseOfStudy || '', school: p.school || '', editing: !!editing };
  sxShow('setup'); sxRenderSetup();
}
function sxEditSetup() { sxStartSetup(true); }
window.sxEditSetup = sxEditSetup;
function sxBackFromSetup() { if (X.prof && X.prof.setUp) sxShow('hub'); else PhqShell.go('/dashboard'); }
window.sxBackFromSetup = sxBackFromSetup;

function sxSubjectsFor(exam) { return (X.cfg.subjects || []).filter(s => (s.exams || []).includes(exam)); }
function sxLimits(exam) { return exam === 'jamb' ? { max: 4, locked: [KEY_ENG] } : (exam === 'waec' || exam === 'neco') ? { max: 9, locked: [KEY_ENG, KEY_MTH] } : { max: 20, locked: [] }; }
function sxSteps() { const s = X.su; return s.exam === 'school' ? ['exam', 'class', 'subjects', 'extra'] : ['exam', 'subjects', 'extra']; }

function sxRenderSetup() {
  const s = X.su, steps = sxSteps(), name = steps[s.step] || 'exam', body = $('sx-su-body');
  $('sx-su-err').textContent = '';
  $('sx-su-step').textContent = `Step ${s.step + 1} of ${steps.length}`;
  $('sx-su-back').style.display = s.step > 0 ? '' : 'none';
  $('sx-su-next').textContent = s.step === steps.length - 1 ? 'Save and start' : 'Continue';
  if (name === 'exam') {
    $('sx-su-title').textContent = 'What are you preparing for?';
    body.innerHTML = `<div class="v-lead">Pick the exam you are working towards. You can change this any time.</div><div class="v-exams">${
      Object.values(X.cfg.exams).map(e => `<button class="v-exam ${s.exam === e.key ? 'selected' : ''}" onclick="sxPickExam('${e.key}')"><b>${esc(e.label)}</b><span>${esc(EXAM_BLURB[e.key] || '')}</span></button>`).join('')
    }</div>`;
  } else if (name === 'class') {
    $('sx-su-title').textContent = 'Which class are you in?';
    body.innerHTML = `<div class="v-lead">We use this to show you questions that fit your class.</div><div class="v-chips">${
      (X.cfg.classLevels || []).map(lv => `<button class="v-chip ${s.classLevel === lv ? 'selected' : ''}" onclick="sxPickClass('${lv}')">${lv}</button>`).join('')
    }</div>`;
  } else if (name === 'subjects') {
    const lim = sxLimits(s.exam);
    if (lim.locked.length) lim.locked.forEach(k => { if (!s.subjects.includes(k) && sxSubjectsFor(s.exam).some(x => x.key === k)) s.subjects.unshift(k); });
    $('sx-su-title').textContent = s.exam === 'jamb' ? 'Your four JAMB subjects' : 'Your subjects';
    const rule = s.exam === 'jamb' ? 'Pick exactly four. English is compulsory, so it is already chosen.'
      : (s.exam === 'waec' || s.exam === 'neco') ? 'Pick up to nine. English and Mathematics are compulsory.' : 'Pick the subjects you want to practise.';
    const combos = s.exam === 'jamb' ? `<label class="v-lbl">Not sure? Pick the course you want to study</label>
      <select class="v-field" onchange="sxPickCombo(this.value)"><option value="">Choose a course of study…</option>${(X.cfg.combos || []).map((c, i) => `<option value="${i}">${esc(c.course)}</option>`).join('')}</select>
      <div class="v-note">These are the usual combinations. Each university sets its own, so confirm with the school you are applying to.</div>` : '';
    body.innerHTML = `<div class="v-lead">${rule} <b id="sx-su-count">${s.subjects.length}</b> chosen.</div>${combos}<div class="v-chips" style="margin-top:14px;" id="sx-su-chips"></div>`;
    sxRenderSubjectChips();
  } else {
    $('sx-su-title').textContent = 'A few last details';
    body.innerHTML = `<div class="v-lead">All optional. They power your countdown and your target.</div>
      <label class="v-lbl">Exam date</label><input class="v-field" type="date" id="sx-su-date" value="${esc(s.examDate)}">
      ${s.exam === 'jamb' ? `<label class="v-lbl">Target UTME score (out of 400)</label><input class="v-field" type="number" min="0" max="400" id="sx-su-target" value="${esc(s.targetScore)}" placeholder="e.g. 260">` : ''}
      <label class="v-lbl">Your school (optional)</label><input class="v-field" id="sx-su-school" maxlength="120" value="${esc(s.school)}" placeholder="e.g. Government College, Lokoja">`;
  }
}
function sxRenderSubjectChips() {
  const s = X.su, lim = sxLimits(s.exam), box = $('sx-su-chips'); if (!box) return;
  if (!sxSubjectsFor(s.exam).length) { box.innerHTML = '<div class="v-empty">No subjects have been added for this exam yet. Please check back soon.</div>'; return; }
  box.innerHTML = sxSubjectsFor(s.exam).map(x => {
    const on = s.subjects.includes(x.key), locked = lim.locked.includes(x.key);
    return `<button class="v-chip ${on ? 'selected' : ''} ${locked ? 'v-locked' : ''}" onclick="sxToggleSubject('${x.key}')">${esc(x.title)}${locked ? ' 🔒' : ''}</button>`;
  }).join('');
  const c = $('sx-su-count'); if (c) c.textContent = s.subjects.length;
}
function sxPickExam(k) { if (X.su.exam !== k) { X.su.exam = k; X.su.subjects = []; X.su.classLevel = k === 'school' ? X.su.classLevel : ''; } sxRenderSetup(); }
window.sxPickExam = sxPickExam;
function sxPickClass(c) { X.su.classLevel = c; sxRenderSetup(); }
window.sxPickClass = sxPickClass;
function sxToggleSubject(k) {
  const s = X.su, lim = sxLimits(s.exam);
  if (lim.locked.includes(k)) return;
  if (s.subjects.includes(k)) s.subjects = s.subjects.filter(x => x !== k);
  else if (s.subjects.length >= lim.max) { $('sx-su-err').textContent = `You can pick at most ${lim.max}.`; return; }
  else s.subjects.push(k);
  $('sx-su-err').textContent = ''; sxRenderSubjectChips();
}
window.sxToggleSubject = sxToggleSubject;
function sxPickCombo(i) {
  if (i === '') return; const c = X.cfg.combos[Number(i)]; if (!c) return;
  X.su.subjects = c.subjects.slice(); X.su.courseOfStudy = c.course; sxRenderSubjectChips();
}
window.sxPickCombo = sxPickCombo;
function sxSetupBack() { if (X.su.step > 0) { sxReadExtra(); X.su.step--; sxRenderSetup(); } }
window.sxSetupBack = sxSetupBack;
function sxReadExtra() {
  const d = $('sx-su-date'); if (d) X.su.examDate = d.value;
  const t = $('sx-su-target'); if (t) X.su.targetScore = t.value;
  const sc = $('sx-su-school'); if (sc) X.su.school = sc.value;
}
async function sxSetupNext() {
  const s = X.su, steps = sxSteps(), name = steps[s.step], err = $('sx-su-err');
  err.textContent = '';
  if (name === 'exam' && !s.exam) { err.textContent = 'Pick an exam to continue.'; return; }

    const q = f.q, got = X.ans[i];
    return `<div class="v-card"><div class="v-qmeta"><span>Q${i + 1}</span>${q.tag ? `<span>${esc(q.tag)}</span>` : ''}</div><div class="v-q" style="font-size:14.5px;margin-bottom:8px;">${esc(q.q)}</div>
      <div style="font-size:13px;line-height:1.55;">${got == null ? '<span style="color:var(--t3);font-weight:700;">Skipped</span>' : `Your answer: <b style="color:var(--no);">${esc(q.opts[got])}</b>`}<br>Right answer: <b style="color:var(--ok);">${esc(q.opts[q.ans])}</b></div>${q.exp ? `<div class="v-exp">${esc(q.exp)}</div>` : ''}</div>`;
  }).join('') : '<div class="v-empty">Nothing to review. Every question was right.</div>');
  html += `<div class="v-row" style="margin-top:6px;"><button class="v-btn v-btn-soft v-grow" onclick="sxHome()">Back to hub</button><button class="v-btn v-grow" onclick="sxAgain()">Another one</button></div>`;
  body.innerHTML = html;
  if (window.PhqSci && PhqSci.render) PhqSci.render(body);
}
function sxAgain() {
  const p = X.paper;
  if (p.kind === 'mock' && p.exam === 'jamb') { sxShow('hub'); sxStartMock(p.label.indexOf('mini') >= 0 ? '1' : ''); return; }
  if (X.pickCtx) { sxShow('pick'); sxPick(X.pickCtx.key, X.pickCtx.kind); } else sxShow('hub');
}
window.sxAgain = sxAgain;

boot();

return { onShow(){ window.scrollTo(0, 0); const hub = $('sx-p-hub'); if (hub && !hub.hidden) sxLoadHub(); } };

</script>
