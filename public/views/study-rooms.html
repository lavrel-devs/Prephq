<!-- View: Study Rooms. Loaded once by js/shell.js into <div class="scr" id="view-study-rooms">, then only shown and hidden.
     This is the source of truth for this screen (the standalone study-rooms.html page was merged into the dashboard shell).
     CSS is scoped to #view-study-rooms; the script runs with a scoped `document`. -->
<style>
#view-study-rooms *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
#view-study-rooms{
  font-family:var(--ff-b);
  
  color:var(--t1);
  min-height:calc(100dvh - var(--nav-space,96px));
  -webkit-font-smoothing:antialiased;
}
#view-study-rooms .wrap{max-width:520px;margin:0 auto;padding:18px 18px 120px;}

/* ═══════════════════════════════════════
   TOPBAR
═══════════════════════════════════════ */
#view-study-rooms .v-topbar{display:flex;align-items:center;gap:12px;padding:6px 0 20px;}
#view-study-rooms .v-back-btn{
  width:38px;height:38px;border-radius:50%;
  background:var(--bg);border:none;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--brand);flex-shrink:0;
  box-shadow:var(--sh);
  transition:box-shadow .15s, transform .15s;
}
#view-study-rooms .v-back-btn:active{transform:scale(.93);box-shadow:var(--sh-in);}
#view-study-rooms .v-back-btn svg{stroke:currentColor;}
#view-study-rooms .pg-title{
  font-family:var(--ff-h);font-size:20px;font-weight:800;
  color:var(--t1);letter-spacing:-.4px;
}

/* ═══════════════════════════════════════
   CARDS
═══════════════════════════════════════ */
#view-study-rooms .card{
  background:var(--bg);
  border-radius:var(--r20);
  padding:20px;
  box-shadow:var(--sh);
  border:none;
  margin-bottom:16px;
}

/* ═══════════════════════════════════════
   INPUTS — inset wells
═══════════════════════════════════════ */
#view-study-rooms .v-f-input{
  width:100%;
  padding:13px 16px;
  border-radius:var(--r16);
  border:none;
  background:var(--bg);
  font-size:14px;
  font-weight:600;
  color:var(--t1);
  outline:none;
  margin-bottom:12px;
  box-shadow:var(--sh-in);
  transition:box-shadow .18s;
  font-family:var(--ff-b);
}
#view-study-rooms .v-f-input::placeholder{color:var(--t4);font-weight:500;}
#view-study-rooms .v-f-input:focus{box-shadow:var(--sh-in), 0 0 0 2px var(--brand-lt);}

/* Native select — styled to blend in but keep chevron */
#view-study-rooms select.v-f-input{
  appearance:none;
  -webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='%237a8296'><path d='M7 10l5 5 5-5z'/></svg>");
  background-repeat:no-repeat;
  background-position:right 14px center;
  padding-right:38px;
  cursor:pointer;
}

/* ═══════════════════════════════════════
   BUTTONS
═══════════════════════════════════════ */
#view-study-rooms .btn{
  border:none;
  border-radius:var(--r16);
  padding:14px;
  font-weight:800;
  font-size:14px;
  cursor:pointer;
  width:100%;
  background:var(--bg);
  color:var(--brand);
  box-shadow:var(--sh);
  font-family:var(--ff-h);
  transition:box-shadow .15s, transform .15s, color .15s;
  letter-spacing:-.2px;
}
#view-study-rooms .btn:active{transform:scale(.98);box-shadow:var(--sh-in);}
#view-study-rooms .btn.ghost{
  background:var(--bg);
  color:var(--t2);
  box-shadow:var(--sh);
}
#view-study-rooms .btn.ghost:active{box-shadow:var(--sh-in);}

/* ═══════════════════════════════════════
   SECTION TITLES
═══════════════════════════════════════ */
#view-study-rooms .v-sec-title{
  font-size:11.5px;
  font-weight:800;
  color:var(--t3);
  text-transform:uppercase;
  letter-spacing:.10em;
  margin-bottom:12px;
}

/* ═══════════════════════════════════════
   LOBBY CODE
═══════════════════════════════════════ */
#view-study-rooms .lobby-code{
  font-family:var(--ff-h);
  font-size:34px;
  font-weight:800;
  letter-spacing:6px;
  text-align:center;
  color:var(--brand);
  margin:18px 0;
  padding:16px 0;
  border-radius:var(--r16);
  background:var(--bg);
  box-shadow:var(--sh-in), 0 0 0 2px var(--brand-lt);
  letter-spacing:.10em;
}

/* ═══════════════════════════════════════
   PARTICIPANT ROWS
═══════════════════════════════════════ */
#view-study-rooms .p-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 0;
  box-shadow:0 -1px 0 var(--sd) inset;
  font-size:13.5px;
  font-weight:700;
  color:var(--t1);
}
#view-study-rooms .p-row:first-child{box-shadow:none;}
#view-study-rooms .p-row span:last-child{
  font-family:var(--ff-h);
  font-size:14.5px;
  color:var(--brand);
  letter-spacing:-.3px;
}

/* ═══════════════════════════════════════
   QUESTION SCREEN
═══════════════════════════════════════ */
#view-study-rooms .q-timer{
  font-family:var(--ff-h);
  font-weight:800;
  font-size:32px;
  text-align:center;
  color:var(--brand);
  margin-bottom:14px;
  letter-spacing:-1.5px;
  padding:12px;
  border-radius:var(--r16);
  background:var(--bg);
  box-shadow:var(--sh-in-sm), 0 0 0 2px var(--brand-lt);
}
#view-study-rooms .q-text{
  font-size:16px;
  font-weight:700;
  text-align:center;
  margin-bottom:20px;
  color:var(--t1);
  font-family:var(--ff-h);
  line-height:1.5;
  letter-spacing:-.2px;
}

/* ═══════════════════════════════════════
   OPTION BUTTONS — raised → inset on state change
═══════════════════════════════════════ */
#view-study-rooms .opt-btn{
  display:block;
  width:100%;
  text-align:left;
  padding:14px 16px;
  border-radius:var(--r16);
  margin-bottom:10px;
  border:none;
  background:var(--bg);
  color:var(--t1);
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  box-shadow:var(--sh);
  transition:box-shadow .15s, transform .15s, color .15s;
  font-family:var(--ff-b);
  line-height:1.4;
}
#view-study-rooms .opt-btn:active:not(:disabled){
  transform:scale(.99);
  box-shadow:var(--sh-in);
}

/* Picked — inset with brand ring, brand text */
#view-study-rooms .opt-btn.picked{
  color:var(--brand);
  box-shadow:var(--sh-in), 0 0 0 2px var(--brand-lt);
}

/* Correct — inset with green ring, green text */
#view-study-rooms .opt-btn.correct{
  color:var(--ok);
  box-shadow:var(--sh-in), 0 0 0 2px var(--ok-lt);
}

/* Wrong — inset with red ring, red text */
#view-study-rooms .opt-btn.wrong{
  color:var(--no);
  box-shadow:var(--sh-in), 0 0 0 2px var(--no-lt);
}

#view-study-rooms .opt-btn:disabled{cursor:default;}

#view-study-rooms .hidden{display:none;}

/* Responsive */
@media (max-width: 420px){
  #view-study-rooms .wrap{padding:16px 16px 100px;}
  #view-study-rooms .pg-title{font-size:18px;}
  #view-study-rooms .lobby-code{font-size:28px;letter-spacing:.08em;}
  #view-study-rooms .q-timer{font-size:28px;}
}
</style>
<div class="wrap">
  <div class="v-topbar">
    <div class="v-back-btn" onclick="leaveAndGoBack()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg></div>
    <div class="pg-title">Study Rooms</div>
  </div>

  <!-- ═══ SCREEN: BROWSE/CREATE/JOIN ═══ -->
  <div id="screen-lobby">
    <div class="card">
      <div class="v-sec-title">Create a Room</div>
      <select class="v-f-input" id="create-course"><option value="">— select course —</option></select>
      <div style="display:flex;gap:10px;">
        <input type="number" class="v-f-input" id="create-count" placeholder="Questions" value="10" style="flex:1;">
        <input type="number" class="v-f-input" id="create-seconds" placeholder="Sec/question" value="20" style="flex:1;">
      </div>
      <button class="btn" onclick="createRoom()">Create Room</button>
    </div>
    <div class="card">
      <div class="v-sec-title">Join a Room</div>
      <input class="v-f-input" id="join-code-input" placeholder="Room code" autocapitalize="none" style="text-transform:uppercase;">
      <button class="btn ghost" onclick="joinRoomByCode()">Join</button>
    </div>
  </div>

  <!-- ═══ SCREEN: WAITING ROOM ═══ -->
  <div id="screen-waiting" class="hidden">
    <div class="card">
      <div class="v-sec-title" style="text-align:center;">Room Code — share with friends</div>
      <div class="lobby-code" id="waiting-code">—</div>
      <div id="waiting-course" style="text-align:center;font-size:12.5px;color:var(--t3);margin-bottom:16px;font-weight:600;"></div>
      <div id="waiting-participants"></div>
      <button class="btn" id="start-room-btn" style="margin-top:16px;display:none;" onclick="startRoom()">Start Room</button>
      <div id="waiting-hint" style="text-align:center;font-size:12px;color:var(--t3);margin-top:12px;font-weight:500;">Waiting for the host to start…</div>
    </div>
  </div>

  <!-- ═══ SCREEN: LIVE QUESTION ═══ -->
  <div id="screen-question" class="hidden">
    <div class="card">
      <div style="font-size:11.5px;color:var(--t3);text-align:center;margin-bottom:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;" id="q-progress">Question 1 of 10</div>
      <div class="q-timer" id="q-timer">20</div>
      <div class="q-text" id="q-text"></div>
      <div id="q-options"></div>
    </div>
    <div class="card">
      <div class="v-sec-title">Live Scores</div>
      <div id="live-scores"></div>
    </div>
  </div>

  <!-- ═══ SCREEN: RESULTS (final) ═══ -->
  <div id="screen-ended" class="hidden">
    <div class="card">
      <div class="v-sec-title" style="text-align:center;">Final Results</div>
      <div id="final-scores"></div>
      <button class="btn" style="margin-top:16px;" onclick="backToLobby()">Back to Lobby</button>
    </div>
  </div>
</div>
<script>
const document = PhqShell.scope(root); // every getElementById/querySelector in this view only sees this view
let socket = null;
let currentRoomCode = null;
let myMatric = null;
let hasAnsweredCurrent = false;

function showScreen(id){
  ['screen-lobby','screen-waiting','screen-question','screen-ended'].forEach(s => {
    document.getElementById(s).classList.toggle('hidden', s !== id);
  });
}

async function loadCourses(){
  try{
    const r = await fetch('/api/courses');
    if(!r.ok) return;
    const courses = await r.json();
    document.getElementById('create-course').innerHTML = '<option value="">— select course —</option>' + courses.map(c => `<option value="${c.key}">${c.courseCode}</option>`).join('');
  }catch(e){}
}

function connectSocket(){
  if(socket) return socket;
  socket = io({ auth: cb => cb({ token: PhqAuth.getSession().accessToken }) }); // fresh token on every (re)connect

  socket.on('room-state', (state) => {
    if(state.status === 'waiting') renderWaiting(state);
  });
  socket.on('room-error', (d) => { alert(d.error || 'Something went wrong'); });
  socket.on('question', (d) => renderQuestion(d));
  socket.on('question-result', (d) => renderQuestionResult(d));
  socket.on('room-ended', (d) => renderEnded(d));

  return socket;
}

async function createRoom(){
  const course = document.getElementById('create-course').value;
  if(!course){ alert('Select a course'); return; }
  const questionCount = parseInt(document.getElementById('create-count').value, 10) || 10;
  const secondsPerQuestion = parseInt(document.getElementById('create-seconds').value, 10) || 20;
  try{
    const r = await PhqAuth.authFetch('/api/study-rooms', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ course, questionCount, secondsPerQuestion }),
    }, 'student');
    const d = await r.json();
    if(!r.ok){ alert(d.error || 'Could not create room'); return; }
    enterRoom(d.code);
  }catch(e){ alert('Could not create room'); }
}

function joinRoomByCode(){
  const code = document.getElementById('join-code-input').value.trim().toUpperCase();
  if(!code){ alert('Enter a room code'); return; }
  enterRoom(code);
}

function enterRoom(code){
  currentRoomCode = code;
  connectSocket();
  socket.emit('join-room', { code });
  showScreen('screen-waiting');
  document.getElementById('waiting-code').textContent = code;
}

function renderWaiting(state){
  document.getElementById('waiting-course').textContent = state.course;
  document.getElementById('waiting-participants').innerHTML = state.participants.map(p =>
    `<div class="p-row"><span>${escapeHtml(p.username || p.matric)}</span><span>${p.score}</span></div>`
  ).join('');
  // getSession doesn't carry matric directly — infer host-ness from the room state's hostMatric vs our own /api/me cache.
  fetchMyMatricOnce().then(matric => {
    document.getElementById('start-room-btn').style.display = (state.hostMatric === matric) ? 'block' : 'none';
  });
}

let cachedMatric = null;
async function fetchMyMatricOnce(){
  if(cachedMatric) return cachedMatric;
  try{
    const r = await PhqAuth.authFetch('/api/me', {}, 'student');
    const d = await r.json();
    cachedMatric = d.matric;
    myMatric = d.matric;
    return cachedMatric;
  }catch(e){ return null; }
}

function startRoom(){
  socket.emit('start-room');
}

let qTimerInterval = null;
function renderQuestion(d){
  showScreen('screen-question');
  hasAnsweredCurrent = false;
  document.getElementById('q-progress').textContent = `Question ${d.index + 1} of ${d.total}`;
  document.getElementById('q-text').textContent = d.question.q;
  document.getElementById('q-options').innerHTML = d.question.opts.map((opt, i) =>
    `<button class="opt-btn" id="opt-${i}" onclick="pickAnswer(${i})">${escapeHtml(opt)}</button>`
  ).join('');

  let remaining = d.secondsPerQuestion;
  document.getElementById('q-timer').textContent = remaining;
  clearInterval(qTimerInterval);
  qTimerInterval = setInterval(() => {
    remaining--;
    document.getElementById('q-timer').textContent = Math.max(0, remaining);
    if(remaining <= 0) clearInterval(qTimerInterval);
  }, 1000);
}

function pickAnswer(i){
  if(hasAnsweredCurrent) return;
  hasAnsweredCurrent = true;
  document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
  document.getElementById(`opt-${i}`).classList.add('picked');
  socket.emit('submit-answer', { answerIndex: i });
}

function renderQuestionResult(d){
  clearInterval(qTimerInterval);
  document.querySelectorAll('.opt-btn').forEach((b, i) => {
    b.disabled = true;
    if(i === d.correctIndex) b.classList.add('correct');
    else if(b.classList.contains('picked')) b.classList.add('wrong');
  });
  document.getElementById('live-scores').innerHTML = [...d.participants].sort((a,b)=>b.score-a.score).map(p =>
    `<div class="p-row"><span>${escapeHtml(p.username || p.matric)}</span><span>${p.score}</span></div>`
  ).join('');
}

function renderEnded(d){
  showScreen('screen-ended');
  document.getElementById('final-scores').innerHTML = d.participants.map(p =>
    `<div class="p-row"><span>#${p.rank} ${escapeHtml(p.username || p.matric)}</span><span>${p.score}</span></div>`
  ).join('');
}

// Leave the current room and show the lobby again (was a full page reload).
function backToLobby(){
  clearInterval(qTimerInterval);
  if(socket && currentRoomCode) socket.emit('leave-room');
  currentRoomCode = null; hasAnsweredCurrent = false;
  showScreen('screen-lobby');
}
function leaveAndGoBack(){
  backToLobby();
  PhqShell.go('/dashboard');
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

loadCourses();
fetchMyMatricOnce();

// If arriving via a shared link like /study-rooms?join=ABCDE, jump straight to joining.
(function autoJoinFromLink(){
  const code = new URLSearchParams(window.location.search).get('join');
  if(code) enterRoom(code.toUpperCase());
})();

// inline onclick="…" handlers run in the global scope, so the functions they call are exposed
window.createRoom = createRoom;
window.joinRoomByCode = joinRoomByCode;
window.startRoom = startRoom;
window.pickAnswer = pickAnswer;
window.backToLobby = backToLobby;
window.leaveAndGoBack = leaveAndGoBack;

return { onShow(){ loadCourses(); } };
//# sourceURL=view-study-rooms.js
</script>
