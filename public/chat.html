
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<script src="/js/theme.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e0e5ec">
<link rel="manifest" href="/manifest.json">
<title>PrepHQ — Study Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="/css/glass.css">
<script src="/js/auth-guard.js"></script>
<script src="/js/shared-nav.js"></script>
<script>
(function(){
  const s = PhqAuth.getSession();
  if(!s || !s.accessToken || s.role !== 'student'){ window.location.replace('/login.html'); }
})();
</script>
<style>
/* ══════════════════════════════════════════════════════════
   NEUMORPHISM / SOFT UI — Study Assistant
   ══════════════════════════════════════════════════════════ */
:root{
  --bg:#e0e5ec;
  --sd:#b8c0cc;
  --sl:#ffffff;

  --sh:6px 6px 14px var(--sd), -6px -6px 14px var(--sl);
  --sh-md:8px 8px 18px var(--sd), -8px -8px 18px var(--sl);
  --sh-lg:12px 12px 26px var(--sd), -12px -12px 26px var(--sl);
  --sh-sm:4px 4px 8px var(--sd), -4px -4px 8px var(--sl);
  --sh-in:inset 4px 4px 10px var(--sd), inset -4px -4px 10px var(--sl);
  --sh-in-sm:inset 3px 3px 6px var(--sd), inset -3px -3px 6px var(--sl);

  --brand:#4a67d1;--brand-dk:#3a54b8;
  --brand-lt:rgba(74,103,209,.10);--brand-glow:rgba(74,103,209,.20);
  --ok:#2d9c6e;--ok-lt:rgba(45,156,110,.12);
  --no:#d14545;--no-lt:rgba(209,69,69,.12);
  --purple:#7b52d1;--purple-lt:rgba(123,82,209,.12);

  --t1:#2a3142;--t2:#4a5568;--t3:#7a8296;--t4:#a8b0c0;

  --bd:transparent;--bd2:transparent;

  --r16:18px;--r20:22px;
  --ff-h:'Bricolage Grotesque',system-ui,sans-serif;
  --ff-b:'DM Sans',system-ui,sans-serif;
}
[data-theme=dark]{
  --bg:#252932;
  --sd:#181b21;--sl:#323743;
  --brand:#7c93ff;--brand-dk:#a5b5ff;
  --brand-lt:rgba(124,147,255,.12);--brand-glow:rgba(124,147,255,.20);
  --ok:#3dba86;--ok-lt:rgba(61,186,134,.14);
  --no:#e56161;--no-lt:rgba(229,97,97,.14);
  --purple:#9d7bea;--purple-lt:rgba(157,123,234,.14);
  --t1:#e8ecf5;--t2:#b8c0d0;--t3:#7a8296;--t4:#4a5060;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:var(--ff-b);
  background:var(--bg);
  color:var(--t1);
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
}

/* ═══════════════════════════════════════
   TOPBAR
═══════════════════════════════════════ */
.topbar{
  display:flex;align-items:center;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 14px;
  flex-shrink:0;
  background:var(--bg);
  box-shadow:0 4px 12px -8px var(--sd);
}
.back-btn{
  width:38px;height:38px;border-radius:50%;
  background:var(--bg);border:none;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--brand);flex-shrink:0;
  box-shadow:var(--sh);
  transition:box-shadow .15s, transform .15s;
}
.back-btn:active{transform:scale(.93);box-shadow:var(--sh-in);}
.pg-title{
  font-family:var(--ff-h);font-size:18px;font-weight:800;
  flex:1;color:var(--t1);letter-spacing:-.4px;
}
.quota{
  font-size:11px;font-weight:700;
  color:var(--brand);
  text-align:right;
  padding:7px 12px;
  border-radius:10px;
  background:var(--bg);
  box-shadow:var(--sh-sm);
  white-space:nowrap;
}

/* ═══════════════════════════════════════
   CHAT
═══════════════════════════════════════ */
.chat-scroll{
  flex:1;overflow-y:auto;
  padding:8px 18px 8px;
  max-width:600px;margin:0 auto;width:100%;
  -webkit-overflow-scrolling:touch;
}
.chat-scroll::-webkit-scrollbar{display:none;}
.chat-scroll{scrollbar-width:none;}

.msg{
  max-width:80%;
  padding:13px 16px;
  border-radius:18px;
  margin-bottom:12px;
  font-size:13.5px;line-height:1.55;
  white-space:pre-wrap;
  word-wrap:break-word;
  animation:msgIn .3s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes msgIn{
  from{opacity:0;transform:translateY(10px) scale(.96);}
  to{opacity:1;transform:translateY(0) scale(1);}
}

/* User bubble — raised with brand text (not a filled gradient) */
.msg.user{
  background:var(--bg);
  color:var(--brand);
  font-weight:600;
  margin-left:auto;
  border-bottom-right-radius:6px;
  box-shadow:var(--sh-md), 0 0 0 2px var(--brand-lt);
}

/* Assistant bubble — raised neutral with inset feel */
.msg.assistant{
  background:var(--bg);
  color:var(--t1);
  font-weight:500;
  margin-right:auto;
  border-bottom-left-radius:6px;
  box-shadow:var(--sh-md);
}

.msg.pending{opacity:.7;}

/* Typing indicator — three soft dots that bounce */
.typing-dots{
  display:inline-flex;gap:5px;align-items:center;
  padding:3px 0;
}
.typing-dots span{
  width:7px;height:7px;border-radius:50%;
  background:var(--brand);
  opacity:.4;
  display:inline-block;
  animation:typingBounce 1.2s infinite ease-in-out;
}
.typing-dots span:nth-child(2){animation-delay:.15s;}
.typing-dots span:nth-child(3){animation-delay:.3s;}
@keyframes typingBounce{
  0%,60%,100%{transform:translateY(0);opacity:.4;}
  30%{transform:translateY(-6px);opacity:1;}
}

/* Empty state */
.empty-state{
  text-align:center;
  padding:60px 30px;
  color:var(--t3);
  animation:msgIn .5s cubic-bezier(.34,1.56,.64,1) both;
}
.empty-icon{
  width:72px;height:72px;
  border-radius:22px;
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 18px;
  box-shadow:var(--sh);
}
.empty-icon i{
  font-size:28px;
  color:var(--brand);
}
.empty-title{
  font-weight:800;
  color:var(--t2);
  font-family:var(--ff-h);
  font-size:15px;
  margin-bottom:6px;
  letter-spacing:-.2px;
}
.empty-sub{
  font-size:12.5px;
  color:var(--t4);
  line-height:1.5;
  max-width:260px;
  margin:0 auto;
}

/* ═══════════════════════════════════════
   INPUT BAR
═══════════════════════════════════════ */
.input-bar{
  display:flex;gap:10px;
  padding:12px 18px calc(12px + env(safe-area-inset-bottom));
  max-width:600px;margin:0 auto;width:100%;flex-shrink:0;
  background:var(--bg);
  box-shadow:0 -6px 16px -8px var(--sd);
}
.input-bar input{
  flex:1;
  padding:13px 18px;
  border-radius:16px;
  border:none;
  background:var(--bg);
  font-size:14px;
  font-weight:600;
  color:var(--t1);
  outline:none;
  box-shadow:var(--sh-in);
  transition:box-shadow .18s;
  font-family:var(--ff-b);
}
.input-bar input::placeholder{color:var(--t4);font-weight:500;}
.input-bar input:focus{
  box-shadow:var(--sh-in), 0 0 0 2px var(--brand-lt);
}

.send-btn{
  width:48px;height:48px;
  border-radius:16px;
  border:none;
  background:var(--bg);
  color:var(--brand);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;
  box-shadow:var(--sh);
  transition:box-shadow .15s, transform .15s, color .15s;
}
.send-btn:active{transform:scale(.94);box-shadow:var(--sh-in);}
.send-btn:disabled{
  opacity:.5;cursor:default;
  box-shadow:var(--sh-in);
  color:var(--t4);
  transform:none;
}
.send-btn i{font-size:15px;}

/* Responsive */
@media (min-width: 640px){
  .topbar,
  .input-bar,
  .chat-scroll{
    max-width:560px;
  }
}
</style>
</head>
<body>
<div class="glass-backdrop"></div>

<div class="topbar">
  <div class="back-btn" onclick="window.location.href='/dashboard'">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
  </div>
  <div class="pg-title">Study Assistant</div>
  <div class="quota" id="quota-txt"></div>
</div>

<div class="chat-scroll" id="chat-scroll">
  <div class="empty-state" id="empty-state">
    <div class="empty-icon"><i class="fa-solid fa-graduation-cap"></i></div>
    <div class="empty-title">Ask me anything academic</div>
    <div class="empty-sub">Explanations, worked examples, study help — I'm here for it.</div>
  </div>
</div>

<div class="input-bar">
  <input type="text" id="chat-input" placeholder="Ask a study question..." onkeydown="if(event.key==='Enter')sendChatMessage()">
  <button class="send-btn" id="send-btn" onclick="sendChatMessage()"><i class="fa-solid fa-paper-plane"></i></button>
</div>

<script>
async function loadHistory(){
  try{
    const r = await PhqAuth.authFetch('/api/chat/history', {}, 'student');
    if(!r.ok) return;
    const messages = await r.json();
    if(messages.length){
      const empty = document.getElementById('empty-state');
      if(empty) empty.remove();
      messages.forEach(m => appendMessage(m.role, m.content));
    }
    scrollToBottom();
  }catch(e){}
}

function appendMessage(role, content){
  const el = document.createElement('div');
  el.className = `msg ${role}`;
  el.textContent = content;
  document.getElementById('chat-scroll').appendChild(el);
  return el;
}

function appendTypingIndicator(){
  const el = document.createElement('div');
  el.className = 'msg assistant pending';
  el.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
  document.getElementById('chat-scroll').appendChild(el);
  return el;
}

function scrollToBottom(){
  const scr = document.getElementById('chat-scroll');
  scr.scrollTop = scr.scrollHeight;
}

async function sendChatMessage(){
  const input = document.getElementById('chat-input');
  const btn = document.getElementById('send-btn');
  const text = input.value.trim();
  if(!text) return;

  const emptyState = document.getElementById('empty-state');
  if(emptyState) emptyState.remove();

  appendMessage('user', text);
  input.value = '';
  scrollToBottom();

  btn.disabled = true;
  const pending = appendTypingIndicator();
  scrollToBottom();

  try{
    const r = await PhqAuth.authFetch('/api/chat/message', {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ message: text }),
    }, 'student');
    const d = await r.json();
    pending.remove();
    if(!r.ok){
      if(d.code === 'LIMIT_REACHED' && typeof showPaywall === 'function') showPaywall(d.error);
      appendMessage('assistant', d.error || 'Something went wrong. Try again.');
    } else {
      appendMessage('assistant', d.reply);
      document.getElementById('quota-txt').textContent = d.dailyRemaining==null ? 'Unlimited' : `${d.dailyRemaining} left today`;
    }
  }catch(e){
    pending.remove();
    appendMessage('assistant', 'Something went wrong. Try again.');
  }
  btn.disabled = false;
  scrollToBottom();
}

async function loadQuota(){
  try{
    const r = await PhqAuth.authFetch('/api/chat/quota', {}, 'student');
    if(!r.ok) return;
    const d = await r.json();
    document.getElementById('quota-txt').textContent = d.dailyRemaining==null ? 'Unlimited' : `${d.dailyRemaining} left today`;
  }catch(e){}
}

loadHistory();
loadQuota();
</script>
</body>
</html>
