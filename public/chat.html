<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<script src="/js/theme.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0A5CF5">
<link rel="manifest" href="/manifest.json">
<title>PrepHQ — Study Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="/css/glass.css">
<script src="/js/auth-guard.js"></script>
<script src="/js/shared-nav.js"></script>
<script>
(function(){
  const s = PhqAuth.getSession();
  if(!s || !s.accessToken || s.role !== 'student'){ window.location.replace('/login.html'); }
})();
</script>
<style>
:root{
  --bg:#F0F2F8;--surf:rgba(255,255,255,.6);--surf2:rgba(245,246,250,.55);--surf3:rgba(235,236,242,.55);
  --brand:#0A5CF5;--brand-dk:#0847C4;--brand-lt:rgba(10,92,245,.10);
  --ok:#00C96B;--ok-lt:rgba(0,201,107,.10);
  --no:#F5340A;--no-lt:rgba(245,52,10,.10);
  --purple:#7B2CF5;--purple-lt:rgba(123,44,245,.10);
  --t1:#0D0F1A;--t2:#2E3247;--t3:#6B7089;--t4:#A8ADCA;
  --bd:rgba(13,15,26,.09);--bd2:rgba(13,15,26,.14);
  --r16:16px;--r20:20px;
  --sh:0 2px 16px rgba(0,0,0,.07);
  --ff-h:'Bricolage Grotesque',system-ui,sans-serif;
  --ff-b:'DM Sans',system-ui,sans-serif;
}
[data-theme=dark]{
  --bg:#0D0F1A;--surf:rgba(26,30,53,.55);--surf2:rgba(34,38,64,.5);--surf3:rgba(42,47,80,.5);
  --t1:#EEF0FF;--t2:#C5CAE8;--t3:#7E86B0;--t4:#4A5070;
  --bd:rgba(238,240,255,.08);--bd2:rgba(238,240,255,.14);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:var(--ff-b);background:var(--bg);color:var(--t1);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 18px;flex-shrink:0;}
.back-btn{width:38px;height:38px;border-radius:50%;background:var(--surf);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t1);flex-shrink:0;}
.pg-title{font-family:var(--ff-h);font-size:18px;font-weight:800;flex:1;}
.quota{font-size:11px;color:var(--t3);text-align:right;}
.chat-scroll{flex:1;overflow-y:auto;padding:0 18px;max-width:600px;margin:0 auto;width:100%;}
.msg{max-width:80%;padding:11px 15px;border-radius:16px;margin-bottom:10px;font-size:13.5px;line-height:1.5;white-space:pre-wrap;}
.msg.user{background:linear-gradient(135deg,var(--brand),var(--purple));color:#fff;margin-left:auto;border-bottom-right-radius:4px;}
.msg.assistant{background:var(--surf);border:1px solid var(--bd);margin-right:auto;border-bottom-left-radius:4px;}
.msg.pending{opacity:.6;}
.typing-dots{display:inline-flex;gap:4px;align-items:center;padding:2px 0;}
.typing-dots span{width:6px;height:6px;border-radius:50%;background:var(--t3);display:inline-block;animation:typingBounce 1.2s infinite ease-in-out;}
.typing-dots span:nth-child(2){animation-delay:.15s;}
.typing-dots span:nth-child(3){animation-delay:.3s;}
@keyframes typingBounce{
  0%,60%,100%{transform:translateY(0);opacity:.5;}
  30%{transform:translateY(-5px);opacity:1;}
}
.empty-state{text-align:center;padding:60px 30px;color:var(--t3);}
.empty-state i{font-size:32px;margin-bottom:12px;color:var(--brand);}
.input-bar{display:flex;gap:8px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));max-width:600px;margin:0 auto;width:100%;flex-shrink:0;}
.input-bar input{flex:1;padding:12px 16px;border-radius:14px;border:1.5px solid var(--bd2);background:var(--surf);font-size:14px;color:var(--t1);outline:none;}
.input-bar input:focus{border-color:var(--brand);}
.send-btn{width:44px;height:44px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--brand),var(--purple));color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.send-btn:disabled{opacity:.5;cursor:default;}
</style>
</head>
<body>
<div class="glass-backdrop"></div>
<div class="topbar">
  <div class="back-btn" onclick="window.location.href='/dashboard'"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg></div>
  <div class="pg-title">Study Assistant</div>
  <div class="quota" id="quota-txt"></div>
</div>

<div class="chat-scroll" id="chat-scroll">
  <div class="empty-state" id="empty-state">
    <i class="fa-solid fa-graduation-cap"></i>
    <div style="font-weight:700;color:var(--t2);margin-bottom:4px;">Ask me anything academic</div>
    <div style="font-size:12.5px;">Explanations, worked examples, study help — I'm here for it.</div>
  </div>
</div>

<div class="input-bar">
  <input type="text" id="chat-input" placeholder="Ask a study question..." onkeydown="if(event.key==='Enter')sendChatMessage()">
  <button class="send-btn" id="send-btn" onclick="sendChatMessage()"><i class="fa-solid fa-paper-plane"></i></button>
</div>

<script>
async function loadHistory(){
  try{
    const r = await PhqAuth.authFetch('/api/chat/history', {}, 'student');
    if(!r.ok) return;
    const messages = await r.json();
    if(messages.length){
      document.getElementById('empty-state').remove();
      messages.forEach(m => appendMessage(m.role, m.content));
    }
    scrollToBottom();
  }catch(e){}
}

function appendMessage(role, content){
  const el = document.createElement('div');
  el.className = `msg ${role}`;
  el.textContent = content;
  document.getElementById('chat-scroll').appendChild(el);
  return el;
}

function appendTypingIndicator(){
  const el = document.createElement('div');
  el.className = 'msg assistant pending';
  el.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
  document.getElementById('chat-scroll').appendChild(el);
  return el;
}

function scrollToBottom(){
  const scr = document.getElementById('chat-scroll');
  scr.scrollTop = scr.scrollHeight;
}

async function sendChatMessage(){
  const input = document.getElementById('chat-input');
  const btn = document.getElementById('send-btn');
  const text = input.value.trim();
  if(!text) return;

  const emptyState = document.getElementById('empty-state');
  if(emptyState) emptyState.remove();

  appendMessage('user', text);
  input.value = '';
  scrollToBottom();

  btn.disabled = true;
  const pending = appendTypingIndicator();
  scrollToBottom();

  try{
    const r = await PhqAuth.authFetch('/api/chat/message', {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ message: text }),
    }, 'student');
    const d = await r.json();
    pending.remove();
    if(!r.ok){
      appendMessage('assistant', d.error || 'Something went wrong. Try again.');
    } else {
      appendMessage('assistant', d.reply);
      document.getElementById('quota-txt').textContent = `${d.dailyRemaining} left today`;
    }
  }catch(e){
    pending.remove();
    appendMessage('assistant', 'Something went wrong. Try again.');
  }
  btn.disabled = false;
  scrollToBottom();
}

async function loadQuota(){
  try{
    const r = await PhqAuth.authFetch('/api/chat/quota', {}, 'student');
    if(!r.ok) return;
    const d = await r.json();
    document.getElementById('quota-txt').textContent = `${d.dailyRemaining} left today`;
  }catch(e){}
}

loadHistory();
loadQuota();
</script>
</body>
</html>
