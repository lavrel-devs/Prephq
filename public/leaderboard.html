
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<script src="/js/theme.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e0e5ec">
<link rel="manifest" href="/manifest.json">
<title>PrepHQ — Leaderboard</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="/css/glass.css">
<script src="/js/auth-guard.js"></script>
<script src="/js/shared-nav.js"></script>
<script>
(function(){
  const s = PhqAuth.getSession();
  if(!s || !s.accessToken || s.role !== 'student'){ window.location.replace('/login.html'); }
})();
</script>
<style>
/* ══════════════════════════════════════════════════════════
   NEUMORPHISM / SOFT UI — Leaderboard
   ══════════════════════════════════════════════════════════ */
:root{
  --bg:#e0e5ec;
  --sd:#b8c0cc;
  --sl:#ffffff;

  --sh:6px 6px 14px var(--sd), -6px -6px 14px var(--sl);
  --sh-md:8px 8px 18px var(--sd), -8px -8px 18px var(--sl);
  --sh-lg:12px 12px 26px var(--sd), -12px -12px 26px var(--sl);
  --sh-sm:4px 4px 8px var(--sd), -4px -4px 8px var(--sl);
  --sh-in:inset 4px 4px 10px var(--sd), inset -4px -4px 10px var(--sl);
  --sh-in-sm:inset 3px 3px 6px var(--sd), inset -3px -3px 6px var(--sl);

  --brand:#4a67d1;--brand-dk:#3a54b8;
  --brand-lt:rgba(74,103,209,.10);--brand-glow:rgba(74,103,209,.20);
  --ok:#2d9c6e;--ok-lt:rgba(45,156,110,.12);
  --no:#d14545;--no-lt:rgba(209,69,69,.12);
  --warn:#c67a1e;--warn-lt:rgba(198,122,30,.12);
  --purple:#7b52d1;--purple-lt:rgba(123,82,209,.12);

  /* Medal colors stay vivid — neumorphism shouldn't wash out rank cues */
  --gold:#c79a1e;
  --silver:#8a90a4;
  --bronze:#a86a3a;

  --t1:#2a3142;--t2:#4a5568;--t3:#7a8296;--t4:#a8b0c0;

  --bd:transparent;--bd2:transparent;

  --r16:18px;--r20:22px;
  --ff-h:'Bricolage Grotesque',system-ui,sans-serif;
  --ff-b:'DM Sans',system-ui,sans-serif;
}
[data-theme=dark]{
  --bg:#252932;
  --sd:#181b21;--sl:#323743;
  --brand:#7c93ff;--brand-dk:#a5b5ff;
  --brand-lt:rgba(124,147,255,.12);--brand-glow:rgba(124,147,255,.20);
  --ok:#3dba86;--ok-lt:rgba(61,186,134,.14);
  --no:#e56161;--no-lt:rgba(229,97,97,.14);
  --warn:#e09437;--warn-lt:rgba(224,148,55,.14);
  --purple:#9d7bea;--purple-lt:rgba(157,123,234,.14);
  --gold:#e8b93a;
  --silver:#a5abc2;
  --bronze:#c47e42;
  --t1:#e8ecf5;--t2:#b8c0d0;--t3:#7a8296;--t4:#4a5060;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
  font-family:var(--ff-b);
  background:var(--bg);
  color:var(--t1);
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:520px;margin:0 auto;padding:18px 18px 120px;}

/* ═══════════════════════════════════════
   TOPBAR
═══════════════════════════════════════ */
.topbar{
  display:flex;align-items:center;gap:12px;
  padding:6px 0 20px;
}
.back-btn{
  width:38px;height:38px;border-radius:50%;
  background:var(--bg);border:none;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--brand);flex-shrink:0;
  box-shadow:var(--sh);
  transition:box-shadow .15s, transform .15s;
}
.back-btn:active{transform:scale(.93);box-shadow:var(--sh-in);}
.pg-title{
  font-family:var(--ff-h);font-size:20px;font-weight:800;
  color:var(--t1);letter-spacing:-.4px;
}

/* ═══════════════════════════════════════
   OPT-IN CARD
═══════════════════════════════════════ */
.optin-card{
  background:var(--bg);
  border-radius:var(--r16);
  padding:16px 18px;
  box-shadow:var(--sh);
  border:none;
  margin-bottom:16px;
  display:flex;align-items:center;justify-content:space-between;gap:14px;
}

/* Neumorphic toggle — inset track, raised knob */
.toggle{
  width:48px;height:26px;
  border-radius:var(--rpill, 999px);
  background:var(--bg);
  border:none;cursor:pointer;
  position:relative;
  transition:box-shadow .2s;
  flex-shrink:0;
  box-shadow:var(--sh-in);
}
.toggle::after{
  content:'';
  position:absolute;top:3px;left:3px;
  width:20px;height:20px;border-radius:50%;
  background:var(--bg);
  box-shadow:var(--sh-sm);
  transition:transform .2s cubic-bezier(.34,1.56,.64,1);
}
.toggle.on{
  box-shadow:var(--sh-in), 0 0 0 2px var(--brand-lt);
}
.toggle.on::after{
  transform:translateX(22px);
  box-shadow:var(--sh-sm), 0 0 0 2px var(--brand-lt);
}

/* ═══════════════════════════════════════
   LEADERBOARD ROWS
═══════════════════════════════════════ */
.lb-row{
  display:flex;align-items:center;gap:14px;
  background:var(--bg);
  border-radius:var(--r16);
  padding:14px 16px;
  margin-bottom:10px;
  box-shadow:var(--sh);
  border:none;
  transition:box-shadow .18s, transform .18s;
}
.lb-row:active{transform:scale(.99);}

/* "Me" row — inset with brand ring, so it stands out without a filled background */
.lb-row.me{
  box-shadow:var(--sh-in), 0 0 0 2px var(--brand-lt);
}

.lb-rank{
  width:32px;
  text-align:center;
  font-family:var(--ff-h);
  font-weight:800;
  font-size:16px;
  color:var(--t3);
  flex-shrink:0;
  letter-spacing:-.5px;
}
.lb-rank.top1{color:var(--gold);}
.lb-rank.top2{color:var(--silver);}
.lb-rank.top3{color:var(--bronze);}

.lb-name{
  flex:1;
  font-size:13.5px;
  font-weight:700;
  color:var(--t1);
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.lb-row.me .lb-name{color:var(--brand);}

.lb-stats{text-align:right;flex-shrink:0;}
.lb-score{
  font-weight:800;
  font-size:15px;
  color:var(--brand);
  font-family:var(--ff-h);
  letter-spacing:-.3px;
}
.lb-sub{
  font-size:10.5px;
  color:var(--t3);
  margin-top:1px;
  font-weight:600;
}

/* ═══════════════════════════════════════
   EMPTY
═══════════════════════════════════════ */
.empty{
  text-align:center;
  padding:60px 20px;
  color:var(--t3);
  font-size:13px;
  font-weight:500;
  line-height:1.55;
}

/* Responsive */
@media (max-width: 420px){
  .wrap{padding:16px 16px 100px;}
  .pg-title{font-size:18px;}
  .lb-row{padding:12px 14px;gap:12px;}
  .lb-rank{width:28px;font-size:15px;}
}
</style>
</head>
<body>
<div class="glass-backdrop"></div>
<div class="wrap">
  <div class="topbar">
    <div class="back-btn" onclick="window.location.href='/dashboard'"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg></div>
    <div class="pg-title">Leaderboard</div>
  </div>

  <div class="optin-card">
    <div>
      <div style="font-size:13px;font-weight:700;color:var(--t1);">Show me on the leaderboard</div>
      <div style="font-size:11.5px;color:var(--t3);margin-top:3px;line-height:1.5;">Your display name and average score become visible to other students</div>
    </div>
    <button class="toggle" id="optin-toggle" onclick="toggleOptIn()"></button>
  </div>

  <div id="lb-list"><div class="empty">Loading…</div></div>
</div>

<script>
async function loadOptInState(){
  try{
    const r = await PhqAuth.authFetch('/api/profile', {}, 'student');
    if(!r.ok) return;
    const d = await r.json();
    document.getElementById('optin-toggle').classList.toggle('on', !!d.leaderboardOptIn);
  }catch(e){}
}

async function toggleOptIn(){
  const el = document.getElementById('optin-toggle');
  const next = !el.classList.contains('on');
  el.classList.toggle('on', next);
  try{
    await PhqAuth.authFetch('/api/profile/leaderboard-optin', {
      method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ optIn: next }),
    }, 'student');
    loadLeaderboard();
  }catch(e){}
}

async function loadLeaderboard(){
  try{
    const r = await PhqAuth.authFetch('/api/leaderboard', {}, 'student');
    if(!r.ok) return;
    const rows = await r.json();
    const list = document.getElementById('lb-list');
    if(!rows.length){
      list.innerHTML = '<div class="empty">No one qualifies yet — the leaderboard needs opted-in students with at least 3 quizzes each. Be the first!</div>';
      return;
    }
    list.innerHTML = rows.map(row => `
      <div class="lb-row ${row.isMe?'me':''}">
        <div class="lb-rank ${row.rank===1?'top1':row.rank===2?'top2':row.rank===3?'top3':''}">${row.rank}</div>
        <div class="lb-name">${row.badge?row.badge+' ':''}${escapeHtml(row.displayName)}${row.isMe?' (you)':''}</div>
        <div class="lb-stats"><div class="lb-score">${row.avgScore}%</div><div class="lb-sub">${row.totalQuizzes} quizzes</div></div>
      </div>`).join('');
  }catch(e){}
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

loadOptInState();
loadLeaderboard();
</script>
</body>
</html>
