
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<script src="/js/theme.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e0e5ec">
<link rel="manifest" href="/manifest.json">
<title>PrepHQ — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="/css/glass.css">
<link rel="stylesheet" href="/css/tokens.css">
<style>

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{height:100%;}
body{
  font-family:var(--ff-b);
  background:var(--bg);
  color:var(--t1);
  min-height:100dvh;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
  position:relative;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* Soft colored haze — no longer blobs, just gradient washes that
   respect the neumorphic "one surface" rule by staying very low
   opacity so the shadows do the visual work. */
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.10;pointer-events:none;}
.b1{width:380px;height:380px;background:var(--brand);top:-100px;right:-100px;}
.b2{width:320px;height:320px;background:var(--purple);bottom:-80px;left:-80px;}
.b3{width:260px;height:260px;background:var(--teal);bottom:20%;right:-60px;}

.card{
  width:100%;max-width:410px;
  position:relative;z-index:1;
  padding:38px 28px 30px;
  background:var(--bg);
  border-radius:28px;
  box-shadow:var(--sh-lg);
  border:none;
}
.logo{
  width:68px;height:68px;border-radius:22px;
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 20px;
  box-shadow:var(--sh);
}
.logo i{font-size:26px;color:var(--brand);}
.title{font-family:var(--ff-h);font-size:24px;font-weight:800;text-align:center;letter-spacing:-.5px;}
.sub{font-size:13px;color:var(--t3);text-align:center;margin-top:5px;margin-bottom:22px;}

/* Segmented tab control — inset trough with a raised active pill */
.tabs{
  display:flex;
  background:var(--bg);
  border:none;
  border-radius:var(--rpill);
  padding:5px;
  margin-bottom:22px;
  box-shadow:var(--sh-in-sm);
}
.tab{
  flex:1;text-align:center;
  padding:10px 0;
  border-radius:var(--rpill);
  font-size:13px;font-weight:800;
  color:var(--t3);
  cursor:pointer;
  transition:box-shadow .18s, color .18s, background .18s;
  background:transparent;
}
.tab:active{transform:scale(.98);}
.tab.on{
  background:var(--bg);
  color:var(--brand);
  box-shadow:var(--sh-sm);
}

/* Error banner */
.err-banner{
  background:var(--bg);
  box-shadow:var(--sh-in), 0 0 0 2px var(--no-lt);
  border-radius:var(--r8);
  padding:11px 14px;
  font-size:13px;font-weight:600;
  color:var(--no);
  display:none;align-items:center;gap:7px;
  margin-bottom:14px;
}
.err-banner.on{display:flex;}

/* Inputs — inset wells */
.f-group{margin-bottom:16px;}
.f-label{
  font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:.08em;
  color:var(--t3);
  display:flex;align-items:center;gap:6px;
  margin-bottom:8px;
}
.f-label .fa-ico{font-size:11px;}
.f-input-wrap{position:relative;}
.f-input-icon{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  color:var(--t4);pointer-events:none;font-size:15px;
  transition:color .18s;
}
.f-input{
  width:100%;
  padding:14px 14px 14px 42px;
  border-radius:var(--r12);
  border:none;
  background:var(--bg);
  font-size:15px;font-weight:600;
  color:var(--t1);
  outline:none;
  transition:box-shadow .18s;
  box-shadow:var(--sh-in);
  letter-spacing:.3px;
}
.f-input::placeholder{color:var(--t4);font-weight:500;letter-spacing:0;}
.f-input:focus{box-shadow:var(--sh-in), 0 0 0 2px var(--brand-lt);}
.f-input:focus + .f-input-icon,
.f-input-wrap:focus-within .f-input-icon{color:var(--brand);}
.f-input.err{box-shadow:var(--sh-in), 0 0 0 2px var(--no-lt);}
.f-hint{font-size:11px;color:var(--t4);margin-top:6px;padding-left:2px;}

/* Primary button — raised neutral with brand text, inverts on press */
.btn-grad{
  width:100%;
  padding:16px;
  border-radius:var(--r12);
  background:var(--bg);
  color:var(--brand);
  font-size:16px;font-weight:800;
  border:none;cursor:pointer;
  box-shadow:var(--sh);
  transition:box-shadow .15s, transform .15s, color .15s;
  font-family:var(--ff-h);
  display:flex;align-items:center;justify-content:center;gap:8px;
  letter-spacing:-.2px;
}
.btn-grad:active{transform:scale(.98);box-shadow:var(--sh-in);}
.btn-grad:disabled{
  color:var(--t4);
  box-shadow:var(--sh-in);
  cursor:default;transform:none;
}
.btn-grad i{font-size:14px;}

.foot{text-align:center;margin-top:18px;font-size:13px;color:var(--t3);}
.foot a{color:var(--brand);font-weight:700;text-decoration:none;}
.foot a:active{opacity:.7;}

/* Toast — raised neutral pill with brand text */
#toast{
  position:fixed;bottom:24px;left:50%;
  transform:translateX(-50%) translateY(16px);
  background:var(--bg);
  color:var(--brand);
  padding:12px 22px;
  border-radius:var(--rpill);
  font-size:13px;font-weight:700;
  opacity:0;
  transition:all .3s var(--ease-o);
  z-index:999;pointer-events:none;white-space:nowrap;
  box-shadow:var(--sh-md);
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

/* Responsive */
@media (max-width: 420px){
  .card{padding:32px 22px 26px;}
  .title{font-size:22px;}
}
</style>
</head>
<body class="fs-md">
<div class="glass-backdrop"></div>
<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="blob b3"></div>

<div id="toast"></div>

<div class="card">
  <div class="logo"><i class="fa-solid fa-graduation-cap"></i></div>
  <div class="title">PrepHQ</div>
  <div class="sub">Sign in to continue</div>

  <div class="tabs">
    <div class="tab on" id="tab-student" onclick="switchTab('student')">Student</div>
    <div class="tab" id="tab-admin" onclick="switchTab('admin')">Admin</div>
  </div>

  <div class="err-banner" id="err"><i class="fa-solid fa-circle-exclamation"></i><span id="err-msg">Invalid credentials</span></div>

  <!-- STUDENT FORM -->
  <form id="form-student" onsubmit="return false;">
    <div class="f-group">
      <div class="f-label"><i class="fa-solid fa-id-card fa-ico"></i> Matric Number</div>
      <div class="f-input-wrap">
        <i class="fa-solid fa-user f-input-icon"></i>
        <input class="f-input" id="s-matric" type="text" placeholder="e.g. PSC25CHM000" autocomplete="username" autocapitalize="characters" spellcheck="false">
      </div>
    </div>
    <div class="f-group">
      <div class="f-label"><i class="fa-solid fa-lock fa-ico"></i> Password</div>
      <div class="f-input-wrap">
        <i class="fa-solid fa-key f-input-icon"></i>
        <input class="f-input" id="s-pass" type="password" placeholder="Your password" autocomplete="current-password">
      </div>
      <div class="f-hint">Use the password you created when you signed up. <a href="/forgot-password" style="color:var(--brand);font-weight:700;text-decoration:none;">Forgot password?</a></div>
    </div>
    <button class="btn-grad" id="s-btn" onclick="studentLogin()"><i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In</button>
    <div class="foot">New student? <a href="/register.html">Create a free account</a></div>
  </form>

  <!-- ADMIN FORM -->
  <form id="form-admin" style="display:none;" onsubmit="return false;">
    <div class="f-group">
      <div class="f-label"><i class="fa-solid fa-user-shield fa-ico"></i> Username</div>
      <div class="f-input-wrap">
        <i class="fa-solid fa-user f-input-icon"></i>
        <input class="f-input" id="a-user" type="text" placeholder="admin" autocomplete="username">
      </div>
    </div>
    <div class="f-group">
      <div class="f-label"><i class="fa-solid fa-lock fa-ico"></i> Password</div>
      <div class="f-input-wrap">
        <i class="fa-solid fa-key f-input-icon"></i>
        <input class="f-input" id="a-pass" type="password" placeholder="Admin password" autocomplete="current-password">
      </div>
      <div class="f-hint">First time? Username is "admin", password is your ADMIN_KEY.</div>
    </div>
    <button class="btn-grad" id="a-btn" onclick="adminLogin()"><i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In</button>
  </form>
</div>

<script src="/js/auth-guard.js"></script>
<script>
if (new URLSearchParams(location.search).get('as') === 'admin') switchTab('admin');

function switchTab(which){
  document.getElementById('tab-student').classList.toggle('on', which==='student');
  document.getElementById('tab-admin').classList.toggle('on', which==='admin');
  document.getElementById('form-student').style.display = which==='student' ? 'block':'none';
  document.getElementById('form-admin').style.display = which==='admin' ? 'block':'none';
  clearErr();
}
function showErr(msg){
  document.getElementById('err-msg').textContent = msg;
  document.getElementById('err').classList.add('on');
}
function clearErr(){ document.getElementById('err').classList.remove('on'); }

async function studentLogin(){
  const matric = document.getElementById('s-matric').value.trim().toUpperCase();
  const password = document.getElementById('s-pass').value; // not trimmed: signup keeps passwords exactly as typed
  const btn = document.getElementById('s-btn');
  clearErr();
  if(!matric||!password){ showErr('Please enter matric and password.'); return; }
  btn.disabled = true;
  try{
    const deviceFingerprint = await PhqAuth.getDeviceFingerprint();
    const res = await fetch('/api/auth/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ matric, password, deviceFingerprint })
    });
    const data = await res.json();
    if(!res.ok){ showErr(data.error || 'Invalid credentials'); btn.disabled=false; return; }
    PhqAuth.setSession({
      role:'student', matric:data.matric, name:data.name, credits:data.credits,
      accessToken:data.accessToken, refreshToken:data.refreshToken,
      expiresInMin:data.expiresInMin, issuedAt: Date.now(),
    });
    if(data.newDeviceFlagged){
      console.info('New device detected for this account.');
    }
    // An admin-issued temporary password must be replaced before the app can be used.
    window.location.href = data.mustChangePassword ? '/change-password' : '/dashboard.html';
  }catch(e){
    showErr('Cannot connect to server.');
    btn.disabled = false;
  }
}

async function adminLogin(){
  const username = document.getElementById('a-user').value.trim();
  const password = document.getElementById('a-pass').value.trim();
  const btn = document.getElementById('a-btn');
  clearErr();
  if(!username||!password){ showErr('Please enter username and password.'); return; }
  btn.disabled = true;
  try{
    const deviceFingerprint = await PhqAuth.getDeviceFingerprint();
    const res = await fetch('/api/auth/admin/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ username, password, deviceFingerprint })
    });
    const data = await res.json();
    if(!res.ok){ showErr(data.error || 'Invalid credentials'); btn.disabled=false; return; }
    PhqAuth.setSession({
      role:'admin', username:data.username,
      accessToken:data.accessToken, refreshToken:data.refreshToken,
      expiresInMin:data.expiresInMin, issuedAt: Date.now(),
    });
    window.location.href = '/admin.html';
  }catch(e){
    showErr('Cannot connect to server.');
    btn.disabled = false;
  }
}

document.getElementById('s-pass').addEventListener('keydown', e=>{ if(e.key==='Enter') studentLogin(); });
document.getElementById('a-pass').addEventListener('keydown', e=>{ if(e.key==='Enter') adminLogin(); });

(function(){
  const s = PhqAuth.getSession();
  if(s && s.accessToken){
    window.location.href = s.role==='admin' ? '/admin.html' : '/dashboard.html';
  }
})();
</script>
</body>
</html>
